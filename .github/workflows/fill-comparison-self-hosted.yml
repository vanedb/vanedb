# Fill bench/COMPARISON.md cosine+L2 for the current host on operator-owned
# dedicated hardware via GitHub Actions self-hosted runners (#198 / #242 AC3).
# Never use github-hosted runners — AGENTS.md forbids publishing those timings.
# Does not run on push/PR. Requires a registered self-hosted runner.
# Results land via PR (main is ruleset-protected; tip push would fail).
name: Fill COMPARISON (self-hosted)

on:
  workflow_dispatch:
    inputs:
      hw_label:
        description: "Optional VANEDB_COMPARE_HW override (empty = auto-detect)"
        required: false
        default: ""
      ref:
        description: "Git ref to check out (empty = workflow branch)"
        required: false
        default: ""
      commit_results:
        description: "Open a PR with COMPARISON.md + run JSON (do not push main)"
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fill:
    # Explicit self-hosted only — never ubuntu-latest / macos-latest.
    runs-on: self-hosted
    timeout-minutes: 360
    steps:
      - name: Refuse github-hosted / Cursor markers
        run: |
          set -euo pipefail
          if [[ -e /opt/hostedtoolcache || -e /opt/cursor || -e /exec-daemon ]]; then
            echo "::error::FS markers indicate a shared runner; refuse AC3 fill"
            exit 1
          fi
          if [[ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]]; then
            echo "::error::RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset} (need self-hosted)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          # Branch + PR (main is PR-protected); GITHUB_TOKEN can push feature branches.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure Rust toolchain
        run: |
          set -euo pipefail
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            # shellcheck disable=SC1091
            source "$HOME/.cargo/env"
          fi
          rustc --version
          cargo --version

      - name: Preflight host packages (C++ / Python)
        run: |
          set -euo pipefail
          missing=()
          command -v python3 >/dev/null 2>&1 || missing+=(python3)
          if ! command -v g++ >/dev/null 2>&1 && ! command -v clang++ >/dev/null 2>&1; then
            missing+=("g++-or-clang++")
          fi
          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "::error::self-hosted runner missing: ${missing[*]} (usearch/hnswlib need a C++17 toolchain; PR step needs python3)"
            exit 1
          fi
          python3 --version
          (command -v g++ >/dev/null && g++ --version | head -1) || true
          (command -v clang++ >/dev/null && clang++ --version | head -1) || true

      - name: Fill host comparison (cosine + L2)
        env:
          VANEDB_COMPARE_HW: ${{ inputs.hw_label }}
        run: |
          set -euo pipefail
          if [[ -f "$HOME/.cargo/env" ]]; then
            # shellcheck disable=SC1091
            source "$HOME/.cargo/env"
          fi
          # Empty override must not export an empty HW label.
          if [[ -z "${VANEDB_COMPARE_HW:-}" ]]; then
            unset VANEDB_COMPARE_HW
          fi
          bash bench/compare/scripts/maintainer_fill_host_comparison.sh

      - name: Upload COMPARISON + run JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: comparison-fill-${{ runner.os }}-${{ github.run_id }}
          path: |
            bench/COMPARISON.md
            bench/compare/runs/
          if-no-files-found: error

      # main requires PRs (ruleset pull_request) — never push tip directly.
      # Use the REST API (python3) so we do not depend on `gh` on the runner.
      - name: Open PR with filled tables
        if: ${{ inputs.commit_results }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/COMPARISON.md bench/compare/runs/
          if git diff --cached --quiet; then
            echo "No COMPARISON changes to commit (slots may already be filled)"
            exit 0
          fi
          BRANCH="bench/fill-comparison-${RUNNER_OS}-${RUN_ID}"
          git switch -c "$BRANCH"
          git commit -m "bench(compare): fill COMPARISON from self-hosted runner (vanedb#242)"
          git push -u origin "HEAD:refs/heads/$BRANCH"
          TITLE="bench(compare): fill COMPARISON from self-hosted (${RUNNER_OS})"
          BODY=$(printf '%s\n' \
            "Self-hosted fill related to vanedb#242 / #198 AC3." \
            "" \
            "- Runner OS: \`${RUNNER_OS}\`" \
            "- Workflow run: ${RUN_URL}" \
            "" \
            "Do not merge cloud/CI timings. Required CI Gate must be green." \
            "Leave #242 open until all six slots and official demo 0.2.0 are evidenced.")
          python3 - "$REPO" "$BRANCH" "$TITLE" "$BODY" <<'PY'
          import json, os, sys, urllib.request
          repo, branch, title, body = sys.argv[1:5]
          token = os.environ["GH_TOKEN"]
          payload = json.dumps({
              "title": title,
              "head": branch,
              "base": "main",
              "body": body,
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls",
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "vanedb-fill-comparison",
              },
          )
          with urllib.request.urlopen(req) as resp:
              data = json.load(resp)
          print(f"Opened PR: {data.get('html_url')}")
          PY
