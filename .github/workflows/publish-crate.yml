name: Publish vanedb crate

# Separate crate and Python tags allow independent verification and publication.
on:
  push:
    tags: ['vanedb-crate-v*']
  # Dispatch verifies only. The publish job below tests `event_name == 'push'`
  # rather than `ref_type == 'tag'` to make that true: a dispatch names a ref,
  # and `gh workflow run ... --ref <a tag>` sets `ref_type` to `tag`, which
  # would have run the publish job from a rehearsal RELEASING.md describes as
  # publication-disabled.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release identity
    runs-on: ubuntu-latest
      # Without this a hung job holds GitHub's six-hour default. These are
      # the jobs that carry an OIDC credential and a protected environment,
      # so they are the ones where that matters most. The ceilings are far
      # above observed runtimes -- the slowest publish job measured 3m57s --
      # so they cannot bite a legitimate run. Time spent waiting for the
      # environment approval is not job runtime and is not counted.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Match tag and crate version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          prefix = "vanedb-crate-v"
          version = tomllib.loads(Path("vanedb/Cargo.toml").read_text())["package"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if not tag.startswith(prefix):
                  raise SystemExit(f"unexpected tag: {tag}")
              expected = tag.removeprefix(prefix)
              if version != expected:
                  raise SystemExit(f"tag expects {expected}, crate version is {version}")
          print(f"validated vanedb {version}")
          PY
      - name: Packaged README carries the published-install form
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vanedb-crate-v')
        shell: bash
        run: python3 scripts/check_release_readmes.py "$GITHUB_REF_NAME"
      - name: Require release tag to be on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vanedb-crate-v')
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi

  verify:
    name: Package and verify
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # Verify publication metadata and the default-feature package build.
      # The following step retains an archive and runs its tests in isolation.
      - name: Verify the package builds from its own contents
        run: cargo publish -p vanedb --locked --dry-run
      - name: Test the unpacked crate and retain its archive
        run: python scripts/check_crate_package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanedb-crate
          path: target/crate-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: verify
    # Same form as publish-rust.yml. A workflow_dispatch can never satisfy it,
    # whatever ref it names.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vanedb-crate-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      # Trusted Publishing: crates.io exchanges this OIDC token for one valid
      # for minutes, so no long-lived registry token is stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # Bootstrap note: crates.io cannot pre-register a trusted publisher the
      # way PyPI's pending publishers can. RFC 3691: "A Trusted Publisher
      # Configuration can only be created after an initial manual publishing
      # of a crate." So the first approved version must be published with a
      # scoped API token, the publisher configured on the crate's settings
      # page, and every release after that runs through here.
      - name: Exchange the OIDC token for a crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p vanedb --locked
