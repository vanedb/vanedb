name: Publish C ABI assets

# Called by the existing crate workflow, so a feature-branch dispatch can
# rehearse this new pipeline before it lands on the default branch.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: capi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_CYCLONEDX_VERSION: '0.5.9'

jobs:
  identity:
    name: Validate C release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: identity
        run: python scripts/capi_release.py identity
      - name: Require release tag to be on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python scripts/check_release_readmes.py "$GITHUB_REF_NAME"

  native:
    name: C distribution (${{ matrix.platform }})
    needs: identity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            deployment: '11.0'
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            deployment: '10.12'
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: '1.94.0'
          components: llvm-tools-preview
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Ensure pkg-config is available
        if: runner.os == 'macOS'
        run: command -v pkg-config || brew install pkgconf
      - name: Build and test the shipping profile and header
        shell: bash
        run: |
          cargo test -p vanedb-capi --profile capi --locked
          cargo build -p vanedb-capi --profile capi --locked
          python scripts/check_capi_header.py
      - name: Package and test installed static and shared consumers
        run: python scripts/package_capi.py --platform ${{ matrix.platform }}
      - name: Install pinned CycloneDX generator
        shell: bash
        run: cargo install cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION" --locked
      - name: Generate the target-specific C ABI SBOM from the same lockfile
        shell: bash
        env:
          CAPI_TARGET: ${{ matrix.target }}
          CAPI_PLATFORM: ${{ matrix.platform }}
        run: |
          cargo cyclonedx --manifest-path vanedb-capi/Cargo.toml --format json --spec-version 1.5 --target "$CAPI_TARGET"
          git diff --exit-code -- Cargo.lock
          python scripts/capi_release.py stage-sbom --source vanedb-capi/vanedb-capi.cdx.json --directory target/c-artifacts --platform "$CAPI_PLATFORM"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capi-native-${{ matrix.platform }}
          path: target/c-artifacts/*
          if-no-files-found: error

  sign:
    name: Sign and verify the complete C release
    needs: [identity, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Build jobs cannot obtain OIDC credentials. This job cannot publish.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: capi-native-*
          path: target/c-artifacts
          merge-multiple: true
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v3.1.3'
      - name: Enforce the exact five-platform inventory and sign every payload
        shell: bash
        run: |
          python scripts/capi_release.py assemble
          python scripts/capi_release.py sign
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capi-signed-release
          path: target/c-release/*
          if-no-files-found: error

  publish:
    name: Attach signed C assets to the crate release
    needs: [identity, sign]
    # A manual dispatch, including one naming a tag, can never publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vanedb-crate-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Reuse the existing reviewer-protected crate-tag environment. A new
    # environment name would be created without required reviewers.
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: capi-signed-release
          path: target/c-release
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: 'v3.1.3'
      - name: Verify retained bytes, upload without replacement, then verify downloaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          CAPI_VERSION: ${{ needs.identity.outputs.version }}
          CAPI_COMMIT: ${{ needs.identity.outputs.commit }}
        run: python scripts/capi_release.py publish --version "$CAPI_VERSION" --commit "$CAPI_COMMIT"
