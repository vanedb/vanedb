name: Benchmark

on:
  pull_request:
    branches: [main]

# Least privilege: checks out and benchmarks code, writes only to the step summary.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Install critcmp
        run: cargo install critcmp --version 0.1.8 --locked

      # -p vanedb --benches runs every [[bench]] target without naming them,
      # so renaming or adding one does not break the main baseline run. Both
      # halves matter: only vanedb sets `bench = false`, so a workspace-wide
      # --benches would also run the sibling libs' libtest harnesses, which
      # reject --save-baseline.
      - name: Benchmark (PR branch)
        run: cargo bench -p vanedb --locked --benches -- --save-baseline pr

      - name: Checkout main
        run: git checkout origin/main

      - name: Benchmark (main baseline)
        run: cargo bench -p vanedb --locked --benches -- --save-baseline main

      - name: Compare benchmarks
        run: |
          echo "## Benchmark Comparison (main vs PR)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          critcmp main pr >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          critcmp main pr --threshold 5
