name: Rust CI

on:
  workflow_call:

# Least privilege: every job here only reads the repo and runs builds/tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude vanedb-py --all-targets --features disk --locked -- -D warnings
      # build.rs regenerates the C header into the source tree. An ABI change
      # plus a forgotten header commit would ship a header that lies about the
      # ABI, and consumers vendor that file by hand.
      - name: C header is in sync with the ABI
        run: |
          cargo build -p vanedb-capi --locked
          git diff --exit-code -- vanedb-capi/include

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The version declared in every Cargo.toml. Bound by bincode 2.x, the
      # newest runtime dependency. `check`, not `test`: criterion is a
      # dev-dependency and needs a newer toolchain than consumers do.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.85.0
      - run: cargo check --workspace --exclude vanedb-py --features disk --locked

  deny:
    name: Advisories & licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # deny.toml documents every exception with a reason and a way out.
          arguments: --all-features

  check-py:
    name: Check (Python bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # vanedb-py is excluded from the workspace jobs (building a wheel needs
      # maturin), but `cargo check` needs only a Python interpreter, so the
      # crate at least compiling is verified cheaply. Behaviour is covered by
      # the wheel-py job below.
      - run: cargo check -p vanedb-py --locked

  wheel-py:
    name: Python wheel (maturin ${{ matrix.maturin-label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - maturin-label: latest
            maturin-version: ''
          - maturin-label: minimum
            maturin-version: v1.9.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      # Use the release action and explicit manylinux target. Older maturin
      # cannot combine this target with the redundant `--compatibility pypi`.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ matrix.maturin-version }}
          target: x86_64
          manylinux: '2_17'
          args: >-
            --release --locked --out dist
            --manifest-path vanedb-py/Cargo.toml -i python3.11
      - name: Install from the wheel alone
        run: |
          python -m pip install --no-index --no-deps --find-links dist --force-reinstall vanedb
          python -m pip install pytest numpy
          python -m pip check
      # A run that imports the checkout instead of the wheel proves nothing,
      # and this repository has a directory named vanedb, so the hazard is
      # live rather than theoretical.
      - name: The import must resolve to the wheel
        run: python scripts/check_wheel_install.py vanedb
      # Run from outside the checkout for the same reason.
      - name: Run the Python suite against the installed wheel
        run: |
          cp -R vanedb-py/tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          python -m pytest wheel-tests -v

  test-native:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            artifact: linux-x86_64
            runner: ubuntu-24.04
            features: disk
          - platform: Linux ARM64
            artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            features: disk
          - platform: macOS ARM64
            artifact: macos-aarch64
            runner: macos-latest
            features: disk,gpu-metal
            deployment: '11.0'
          - platform: macOS x86_64
            artifact: macos-x86_64
            runner: macos-15-intel
            features: disk
            deployment: '10.12'
          - platform: Windows x86_64
            artifact: windows-x86_64
            runner: windows-latest
            features: disk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --exclude vanedb-py --features ${{ matrix.features }} --locked
      - name: Build and run C consumer acceptance
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
        run: |
          cargo build -p vanedb-capi --release --locked
          cmake -S vanedb-capi/examples -B target/c-example -DCMAKE_BUILD_TYPE=Release
          cmake --build target/c-example --config Release
          ctest --test-dir target/c-example --build-config Release --output-on-failure
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Package C libraries and test an extracted consumer
        run: python scripts/package_capi.py --platform ${{ matrix.artifact }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vanedb-capi-${{ matrix.artifact }}
          path: target/c-artifacts/*
          if-no-files-found: error

  test-wasm:
    name: Test (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Test WASM
        run: cd vanedb-wasm && wasm-pack test --node --locked
      - name: Test WASM in Chrome
        env:
          WASM_BINDGEN_USE_BROWSER: '1'
        run: cd vanedb-wasm && wasm-pack test --headless --chrome --locked
      - name: Test generated JavaScript conversions
        run: |
          wasm-pack build vanedb-wasm --target nodejs --release --locked
          node vanedb-wasm/tests/node.cjs ./vanedb-wasm/pkg
          node vanedb-wasm/examples/quickstart.cjs
      - name: Pack JavaScript distributions and test the installed Node artifact
        run: |
          python3 scripts/package_wasm.py nodejs vanedb-wasm/pkg
          wasm-pack build vanedb-wasm --target web --release --out-dir ../target/wasm-web --locked
          python3 scripts/package_wasm.py web target/wasm-web
      - name: Test the browser artifact in Chrome, Firefox and WebKit
        run: |
          npx --yes --package @playwright/cli@0.1.19 playwright-cli install-browser firefox --with-deps
          npx --yes --package @playwright/cli@0.1.19 playwright-cli install-browser webkit --with-deps
          for browser in chrome firefox webkit; do
            python3 scripts/test_web_package.py target/wasm-artifacts/web/*.tgz "$browser"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vanedb-wasm-packages
          path: target/wasm-artifacts/
          if-no-files-found: error

  build-ios:
    name: Test (iOS arm64 simulator and device build)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - run: cargo build -p vanedb -p vanedb-capi --target aarch64-apple-ios --features disk --release --locked
      - run: cargo build -p vanedb-capi --target aarch64-apple-ios-sim --release --locked
      - name: Run C ABI acceptance in an iOS simulator
        run: python3 scripts/test_ios.py

  build-android:
    name: Test (Android x86_64 emulator and arm64 build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26b
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Cross-compile core and C ABI for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t x86_64 build -p vanedb -p vanedb-capi --features disk --release --locked
      - name: Check the ELF alignment guard on a 4 KiB test library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          printf '%s\n' 'int probe(void) { return 0; }' > target/android-alignment-probe.c
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" \
            -shared -Wl,-z,max-page-size=4096 -Wl,-z,common-page-size=4096 \
            target/android-alignment-probe.c -o target/android-unaligned.so
          if python3 scripts/check_android_elf.py target/android-unaligned.so; then
            echo 'alignment guard accepted a 4 KiB ELF library'
            exit 1
          fi
      - name: Build ARM64 runtime acceptance bundle
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VANEDB_ANDROID_ABI: arm64-v8a
        run: |
          bash scripts/test_android.sh --build-only
          git rev-parse HEAD > target/android-arm64-v8a-runtime/source-revision.txt
          cp LICENSE target/android-arm64-v8a-runtime/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vanedb-android-arm64-runtime
          path: target/android-arm64-v8a-runtime/*
          if-no-files-found: error
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run C ABI acceptance in an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash scripts/test_android.sh
