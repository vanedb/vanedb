name: Rust CI

on:
  workflow_call:

# Least privilege: every job here only reads the repo and runs builds/tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude vanedb-py --all-targets --features disk --locked -- -D warnings
      # build.rs regenerates the C header into the source tree. An ABI change
      # plus a forgotten header commit would ship a header that lies about the
      # ABI, and consumers vendor that file by hand.
      - name: C header is in sync with the ABI
        run: |
          cargo build -p vanedb-capi --locked
          git diff --exit-code -- vanedb-capi/include

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The version declared in every Cargo.toml. Bound by bincode 2.x, the
      # newest runtime dependency. `check`, not `test`: criterion is a
      # dev-dependency and needs a newer toolchain than consumers do.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.85.0
      - run: cargo check --workspace --exclude vanedb-py --features disk --locked

  deny:
    name: Advisories & licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # deny.toml documents every exception with a reason and a way out.
          arguments: --all-features

  check-py:
    name: Check (Python bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # vanedb-py is excluded from the workspace jobs (building a wheel needs
      # maturin), but `cargo check` needs only a Python interpreter, so the
      # crate at least compiling is verified cheaply. Behaviour is covered by
      # the wheel-py job below.
      - run: cargo check -p vanedb-py --locked

  wheel-py:
    name: Python wheel (build, install, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      # Built the way the release workflow builds it — same action, same
      # manylinux target and flags — so this gate exercises the artifact that
      # ships rather than a differently configured one. Until now the Python
      # bindings had no behavioural coverage before a release.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          manylinux: '2_17'
          args: >-
            --release --locked --compatibility pypi --out dist
            --manifest-path vanedb-py/Cargo.toml -i python3.11
      - name: Install from the wheel alone
        run: |
          python -m pip install --no-index --no-deps --find-links dist --force-reinstall vanedb
          python -m pip install pytest numpy
          python -m pip check
      # A run that imports the checkout instead of the wheel proves nothing,
      # and this repository has a directory named vanedb, so the hazard is
      # live rather than theoretical.
      - name: The import must resolve to the wheel
        run: python scripts/check_wheel_install.py vanedb
      # Run from outside the checkout for the same reason.
      - name: Run the Python suite against the installed wheel
        run: |
          cp -R vanedb-py/tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          python -m pytest wheel-tests -v

  test-linux:
    name: Test (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --exclude vanedb-py --features disk --locked

  test-macos:
    name: Test (macOS ARM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --exclude vanedb-py --features disk,gpu-metal --locked

  test-windows:
    name: Test (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --exclude vanedb-py --features disk --locked

  test-wasm:
    name: Test (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Test WASM
        run: cd vanedb-wasm && wasm-pack test --node --locked

  build-ios:
    name: Build (iOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      # Cross-compile only: there is no iOS test runner, mirroring the
      # build-only verification the C++ repo uses for mobile.
      - run: cargo build -p vanedb --target aarch64-apple-ios --features disk --release --locked

  build-android:
    name: Build (Android arm64-v8a, x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Set up Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26b
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Cross-compile core for Android
        run: cargo ndk -t arm64-v8a -t x86_64 build -p vanedb --features disk --release --locked
