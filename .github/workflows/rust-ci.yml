name: Rust CI

on:
  workflow_call:

# Least privilege: every job here only reads the repo and runs builds/tests.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude vanedb-py --all-targets --features disk --locked -- -D warnings

  check-py:
    name: Check (Python bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # vanedb-py is excluded from the workspace jobs (building a wheel needs
      # maturin), but `cargo check` needs only a Python interpreter, so the
      # crate at least compiling is verified cheaply. Behaviour is covered by
      # the wheel-py job below.
      - run: cargo check -p vanedb-py --locked

  wheel-py:
    name: Python wheel (build, install, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      # Built the way the release workflow builds it — same action, same
      # manylinux target and flags — so this gate exercises the artifact that
      # ships rather than a differently configured one. Until now the Python
      # bindings had no behavioural coverage before a release.
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x86_64
          manylinux: '2_17'
          args: >-
            --release --locked --compatibility pypi --out dist
            --manifest-path vanedb-py/Cargo.toml -i python3.11
      - name: Install from the wheel alone
        run: |
          python -m pip install --no-index --no-deps --find-links dist --force-reinstall vanedb
          python -m pip install pytest numpy
          python -m pip check
      # A run that imports the checkout instead of the wheel proves nothing,
      # and this repository has a directory named vanedb, so the hazard is
      # live rather than theoretical.
      - name: The import must resolve to the wheel
        run: python scripts/check_wheel_install.py vanedb
      # Run from outside the checkout for the same reason.
      - name: Run the Python suite against the installed wheel
        run: |
          cp -R vanedb-py/tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          python -m pytest wheel-tests -v

  test-native:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-latest
            features: disk
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            features: disk
          - platform: macOS ARM64
            runner: macos-latest
            features: disk,gpu-metal
          - platform: macOS x86_64
            runner: macos-15-intel
            features: disk
          - platform: Windows x86_64
            runner: windows-latest
            features: disk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --exclude vanedb-py --features ${{ matrix.features }} --locked
      - name: Build and run C consumer acceptance
        run: |
          cargo build -p vanedb-capi --release --locked
          cmake -S vanedb-capi/examples -B target/c-example -DCMAKE_BUILD_TYPE=Release
          cmake --build target/c-example --config Release
          ctest --test-dir target/c-example --build-config Release --output-on-failure

  test-wasm:
    name: Test (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Test WASM
        run: cd vanedb-wasm && wasm-pack test --node --locked
      - name: Test WASM in Chrome
        env:
          WASM_BINDGEN_USE_BROWSER: '1'
        run: cd vanedb-wasm && wasm-pack test --headless --chrome --locked
      - name: Test generated JavaScript conversions
        run: |
          wasm-pack build vanedb-wasm --target nodejs --release --locked
          node vanedb-wasm/tests/node.cjs ./vanedb-wasm/pkg
          node vanedb-wasm/examples/quickstart.cjs

  build-ios:
    name: Test (iOS arm64 simulator and device build)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - run: cargo build -p vanedb -p vanedb-capi --target aarch64-apple-ios --features disk --release --locked
      - run: cargo build -p vanedb-capi --target aarch64-apple-ios-sim --release --locked
      - name: Run C ABI acceptance in an iOS simulator
        run: python3 scripts/test_ios.py

  build-android:
    name: Test (Android x86_64 emulator and arm64 build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android, x86_64-linux-android
      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26b
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Cross-compile core and C ABI for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t x86_64 build -p vanedb -p vanedb-capi --features disk --release --locked
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run C ABI acceptance in an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: bash scripts/test_android.sh
