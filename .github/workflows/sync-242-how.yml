# Refresh residual #242 How onto the current AC5 tag path (not historical --cut).
# Cloud agents often lack issues:write; Actions GITHUB_TOKEN can edit the issue.
# Does not shut #242 / #198 / #226.
name: Sync #242 How

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/launch/sync_242_how.sh"
      - "scripts/sync_242_how.py"
      - ".github/workflows/sync-242-how.yml"

concurrency:
  group: sync-242-how
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update only the bounded #242 How section (--tag path)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash docs/launch/sync_242_how.sh --apply
