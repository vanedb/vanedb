# Annotated 0.2.0 tag for the current AC5 candidate (demo PR #20).
# Requires: DEMO_REPO_TOKEN (contents:write + pull_requests:write on
# vanedb/obsidian-vane-search) and an explicit vault-walkthrough confirmation.
# Passes --merge-if-open so one dispatch can merge #20 (merge commit) then tag
# when the PR is still OPEN with vault acceptance recorded.
# Historical patch cut is cut-demo-0.2.0.yml — do not use it for this candidate.
# Does not run on push/PR.
name: Tag demo 0.2.0

on:
  workflow_dispatch:
    inputs:
      confirm_vault_walkthrough:
        description: "I completed the real Obsidian/Ollama vault checklist (acceptance on PR #20 head or merged commit)"
        type: boolean
        required: true
        default: false
      commit:
        description: "Optional merge-commit SHA (default: demo PR #20 merge commit after merge-if-open)"
        type: string
        required: false
        default: ""

concurrency:
  group: tag-demo-0.2.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require vault confirmation
        if: ${{ inputs.confirm_vault_walkthrough != true }}
        run: |
          echo "::error::Set confirm_vault_walkthrough=true after completing the real vault checklist (demo docs/releases/0.2.0.md)."
          exit 1

      - name: Require DEMO_REPO_TOKEN
        env:
          DEMO_REPO_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          if [ -z "${DEMO_REPO_TOKEN}" ]; then
            echo "::error::Add repository secret DEMO_REPO_TOKEN (contents:write + pull_requests:write on vanedb/obsidian-vane-search), then re-run."
            exit 1
          fi

      - name: Merge demo PR #20 if open, then tag official 0.2.0
        env:
          # Demo-repo token for both gh (merge/view) and git push — not GITHUB_TOKEN.
          DEMO_REPO_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          set -euo pipefail
          args=(--confirm-vault-walkthrough --merge-if-open)
          if [ -n "${{ inputs.commit }}" ]; then
            args+=(--commit="${{ inputs.commit }}")
          fi
          bash docs/launch/maintainer_tag_demo_0.2.0.sh "${args[@]}"
