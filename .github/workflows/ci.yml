name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow always runs. Component workflows are selected after checkout,
# and the final job is the only required branch-protection check.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      cpp: ${{ steps.filter.outputs.cpp }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'conformance/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'vanedb/**'
              - 'vanedb-capi/**'
              - 'vanedb-py/**'
              - 'vanedb-wasm/**'
              - '.github/requirements-release.txt'
              - '.github/workflows/**'
            cpp:
              - 'conformance/**'
              - 'cpp/**'
              - '.github/requirements-release.txt'
              - '.github/workflows/**'
            integration:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'vanedb/**'
              - 'vanedb-capi/**'
              - 'cpp/**'
              - 'bench/**'
              - 'conformance/**'
              - '.github/workflows/**'

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          path="$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location \
            --output "$path" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "$ACTIONLINT_SHA256  $path" | sha256sum --check --status
          tar --extract --gzip --file "$path" --directory "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows
        run: actionlint -color

  rust:
    name: Rust component
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    uses: ./.github/workflows/rust-ci.yml

  cpp:
    name: C++ component
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/cpp-ci.yml

  integration:
    name: Cross-engine integration
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    uses: ./.github/workflows/integration-ci.yml

  gate:
    name: Required CI Gate
    if: ${{ always() }}
    needs: [changes, workflow-lint, rust, cpp, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every affected component passed
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          CPP_CHANGED: ${{ needs.changes.outputs.cpp }}
          CPP_RESULT: ${{ needs.cpp.result }}
          INTEGRATION_CHANGED: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$WORKFLOW_LINT_RESULT" != "success" ]]; then
            echo "Workflow lint did not succeed: $WORKFLOW_LINT_RESULT"
            exit 1
          fi

          verify_component() {
            local name="$1"
            local changed="$2"
            local result="$3"

            if [[ "$changed" == "true" && "$result" != "success" ]]; then
              echo "$name changed but its workflow result was $result"
              exit 1
            fi
            if [[ "$changed" != "true" && "$result" != "skipped" ]]; then
              echo "$name did not change but its workflow result was $result"
              exit 1
            fi
          }

          verify_component rust "$RUST_CHANGED" "$RUST_RESULT"
          verify_component cpp "$CPP_CHANGED" "$CPP_RESULT"
          verify_component integration "$INTEGRATION_CHANGED" "$INTEGRATION_RESULT"
          echo "All affected components passed."
