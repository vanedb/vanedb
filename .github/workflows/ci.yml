name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR makes the in-flight run's verdict obsolete, and
# this workflow fans out to ~53 jobs, so leaving it running costs ~80 job-
# minutes and queues behind the run that will actually be read. Pushes to main
# are never cancelled: each main commit keeps its own recorded verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This workflow always runs. Component workflows are selected after checkout,
# and the final job is the only required branch-protection check.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # A release-source rehearsal must run every component, even for docs-only S.
      rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rust }}
      cpp: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.cpp }}
      integration: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              # scripts/check_wheel_install.py is the guard the wheel job
              # runs, so a change to it must trigger the jobs that run it.
              - 'scripts/**'
              - 'conformance/**'
              - 'README.md'
              # vanedb/tests/platforms.rs holds these two pages to the README.
              - 'SECURITY.md'
              - 'docs/PLATFORMS.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'vanedb/**'
              - 'vanedb-capi/**'
              - 'vanedb-py/**'
              - 'vanedb-wasm/**'
              - '.github/requirements-release.txt'
              - '.github/workflows/**'
            cpp:
              - 'conformance/**'
              - 'vanedb/tests/fixtures/**'
              - 'cpp/**'
              - '.github/requirements-release.txt'
              - '.github/workflows/**'
            integration:
              # Validate closeout automation before its next live main-push run.
              - 'docs/launch/nudge_242_closeout.sh'
              - 'scripts/test_nudge_closeout.py'
              - 'docs/launch/sync_242_how.sh'
              - 'scripts/sync_242_how.py'
              - 'scripts/test_sync_242_how.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'vanedb/**'
              - 'vanedb-capi/**'
              - 'cpp/**'
              - 'bench/**'
              - 'conformance/**'
              - '.github/workflows/**'

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          path="$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location \
            --output "$path" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "$ACTIONLINT_SHA256  $path" | sha256sum --check --status
          tar --extract --gzip --file "$path" --directory "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Lint GitHub Actions workflows
        run: actionlint -color
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check release wheel tripwires against the build matrices
        shell: bash
        run: |
          python -m pip install --constraint .github/requirements-release.txt PyYAML
          python .github/scripts/check_wheel_matrix.py

      - name: CI dispatch and required-gate regression tests
        run: python3 scripts/test_ci_dispatch.py

      # `check_release_readmes.py` otherwise runs for the first time in its life
      # during an irreversible publish. These cases are the rewordings a review
      # used to defeat its first version, and the correct install forms that
      # version wrongly rejected.
      - name: Release script tests
        shell: bash
        run: python3 scripts/test_release_scripts.py

      - name: Installed wheel guard tests
        run: python3 scripts/test_check_wheel_install.py

      # `bump_version.py` writes the version into every site for a publish no
      # registry lets you take back, and its own tests claimed to run here
      # while nothing ran them. A silent corruption it once caused -- four
      # sites in one file, only the last write surviving -- is what they cover.
      - name: Version bump script tests
        shell: bash
        run: python3 scripts/test_bump_version.py

      # `package_capi.py` runs only on the native packaging legs, after a full
      # release build, so a wrong linker flag surfaces as a failed macOS or
      # Windows job twenty minutes in. Its assembled commands are pinned here.
      - name: C ABI packaging script tests
        shell: bash
        run: python3 scripts/test_package_capi.py

      # The ABI gate's prototype layer is what sees a changed signature (the
      # shipped library has no DWARF for abidiff to read); a changed or
      # removed prototype must fail it, and the committed signature list
      # must match the header.
      - name: C ABI gate tests
        shell: bash
        run: python3 scripts/test_capi_abidiff.py

      - name: Signed C ABI release inventory and publication guard tests
        shell: bash
        run: python3 scripts/test_capi_release.py

      # Every RFC needs a valid status line and a row in both indexes, or the
      # roadmap stops being an index of anything.
      - name: RFC index checks
        shell: bash
        run: |
          python3 scripts/test_check_rfcs.py
          python3 scripts/check_rfcs.py

  rust:
    name: Rust component
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    # id-token: write is required by the Coverage job's Codecov OIDC upload.
    # A called workflow cannot request more than its caller grants, so
    # omitting this fails the whole run at startup, before any job. The cpp
    # caller below grants the same set for the same reason.
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/rust-ci.yml

  cpp:
    name: C++ component
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/cpp-ci.yml

  integration:
    name: Cross-engine integration
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    uses: ./.github/workflows/integration-ci.yml

  gate:
    name: Required CI Gate
    if: ${{ always() }}
    needs: [changes, workflow-lint, rust, cpp, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every affected component passed
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          RUST_RESULT: ${{ needs.rust.result }}
          CPP_CHANGED: ${{ needs.changes.outputs.cpp }}
          CPP_RESULT: ${{ needs.cpp.result }}
          INTEGRATION_CHANGED: ${{ needs.changes.outputs.integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [[ "$WORKFLOW_LINT_RESULT" != "success" ]]; then
            echo "Workflow lint did not succeed: $WORKFLOW_LINT_RESULT"
            exit 1
          fi

          verify_component() {
            local name="$1"
            local changed="$2"
            local result="$3"

            if [[ "$changed" == "true" && "$result" != "success" ]]; then
              echo "$name changed but its workflow result was $result"
              exit 1
            fi
            if [[ "$changed" != "true" && "$result" != "skipped" ]]; then
              echo "$name did not change but its workflow result was $result"
              exit 1
            fi
          }

          verify_component rust "$RUST_CHANGED" "$RUST_RESULT"
          verify_component cpp "$CPP_CHANGED" "$CPP_RESULT"
          verify_component integration "$INTEGRATION_CHANGED" "$INTEGRATION_RESULT"
          echo "All affected components passed."
