name: Cross-engine Integration CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  harness-lint:
    name: Lint the shared harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Check benchmark formatting
        run: cargo fmt --manifest-path bench/Cargo.toml --all -- --check
      - name: Check competitor-harness formatting
        run: cargo fmt --manifest-path bench/compare/Cargo.toml --all -- --check
      - name: Check fixed legacy graph files
        run: shasum -a 256 -c conformance/legacy_graph/SHA256SUMS
      - name: Check portable graph files
        run: shasum -a 256 -c conformance/graph/SHA256SUMS
      - name: Check competitor fixture checksums
        # Only verify files that exist (embeddings.vnef is hosted, not committed).
        working-directory: bench/compare/fixtures
        run: |
          awk '{name=$2; sub(/^\*/,"",name); print}' SHA256SUMS | while read -r name; do
            [ -f "$name" ] || continue
            awk -v n="$name" '$2==n || $2=="*"n {print}' SHA256SUMS | shasum -a 256 -c -
          done
          # smoke.vnef must always be present and listed.
          grep -E '(^| )smoke\.vnef$' SHA256SUMS >/dev/null
          test -f smoke.vnef
          echo "ok: present fixture checksums"
      - name: Lint shared harness
        run: cargo clippy --manifest-path bench/Cargo.toml --all-targets --locked -- -D warnings
      - name: Lint competitor harness
        run: cargo clippy --manifest-path bench/compare/Cargo.toml --all-targets --locked -- -D warnings

  harness:
    name: Build and test both C ABIs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers the cmake/link glue; macos is the platform the README
        # snapshot is captured on.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Test shared harness
        run: cargo test --manifest-path bench/Cargo.toml --locked
      - name: Compile all cross-engine benchmarks
        run: cargo bench --manifest-path bench/Cargo.toml --locked --no-run
      # End-to-end proof that the report path still executes, at sizes that
      # finish in under a second. Shared-runner timings are meaningless, so
      # nothing here asserts one; recall is a correctness signal and the binary
      # asserts it against its own sanity floor.
      - name: Smoke-run the report binary
        env:
          VANEDB_BENCH_N: 500
          VANEDB_BENCH_DIM: 32
          VANEDB_BENCH_QUERIES: 5
          VANEDB_BENCH_OUT: ${{ runner.temp }}/RESULTS.md
        run: |
          cargo run --release --manifest-path bench/Cargo.toml --locked --bin report
          # Match the metric, not the type name: this check has drifted
          # from the report's wording three times across renames.
          grep -q 'recall@10' "$VANEDB_BENCH_OUT"
      - name: The harness must not write into the source tree
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "the harness left files in the working tree"
            exit 1
          fi

  compare-smoke:
    name: Competitor harness smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Test competitor harness
        run: cargo test --manifest-path bench/compare/Cargo.toml --locked
      - name: Smoke-run every engine on the smoke fixture
        # Correctness only: shared-runner timings are discarded by policy
        # (bench/COMPARISON.md). max-queries keeps the job short.
        run: |
          cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke \
            --force-sqlite-vec-cosine \
            --rounds 1 \
            --max-queries 4 \
            --ef 50 \
            --skip-save \
            --json-out "${{ runner.temp }}/compare-smoke.json"
          python3 bench/compare/scripts/assert_smoke_report.py \
            "${{ runner.temp }}/compare-smoke.json"
      - name: Cosine default omits sqlite-vec
        run: |
          cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke \
            --rounds 1 \
            --max-queries 2 \
            --ef 50 \
            --skip-save \
            --skip-delete \
            --json-out "${{ runner.temp }}/compare-cosine-default.json"
          python3 - <<'PY'
          import json
          r=json.load(open("${{ runner.temp }}/compare-cosine-default.json"))
          engines={row["engine"] for row in r["results"]}
          assert "sqlite-vec" not in engines, engines
          assert len(engines)==5, engines
          print("ok: cosine default engines", sorted(engines))
          PY
      - name: Markdown refuses smoke even with allow-smoke
        run: |
          if cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 --ef 50 --skip-save --skip-delete \
            --json-out "${{ runner.temp }}/should-fail.json"; then
            echo "expected markdown refusal" >&2
            exit 1
          fi
          echo "ok: markdown refused smoke"
      - name: Markdown refuses force-sqlite-vec-cosine
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --force-sqlite-vec-cosine --markdown --rounds 2 --ef 50 \
            --json-out "${{ runner.temp }}/should-fail-force.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'force-sqlite-vec-cosine'
          echo "ok: markdown refused force-sqlite-vec-cosine (not masked by role)"
      - name: Markdown refuses skip-delete
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --skip-delete --markdown --rounds 2 --ef 50 \
            --json-out "${{ runner.temp }}/should-fail-skip-del.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'skip-delete'
          echo "ok: markdown refused skip-delete"
      - name: Markdown refuses skip-save
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --skip-save --markdown --rounds 2 --ef 50 \
            --json-out "${{ runner.temp }}/should-fail-skip-save.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'skip-save'
          echo "ok: markdown refused skip-save"
      - name: Markdown refuses non-canonical ef sweep
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 --ef 50 \
            --json-out "${{ runner.temp }}/should-fail-ef.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q '\-\-ef'
          echo "ok: markdown refused non-canonical --ef"
      - name: Markdown refuses engine cherry-pick
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 --engine vanedb \
            --json-out "${{ runner.temp }}/should-fail-engine.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'incomplete engine set'
          echo "ok: markdown refused engine cherry-pick"
      - name: Markdown refuses missing dedicated attestation
        run: |
          set +e
          out=$(env -u VANEDB_COMPARE_DEDICATED cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 \
            --json-out "${{ runner.temp }}/should-fail-dedicated.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'VANEDB_COMPARE_DEDICATED'
          echo "ok: markdown refused missing VANEDB_COMPARE_DEDICATED"
      - name: Markdown refuses shared CI runner even when attested
        run: |
          set +e
          out=$(VANEDB_COMPARE_DEDICATED=1 cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 \
            --json-out "${{ runner.temp }}/should-fail-ci.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'shared CI/cloud'
          echo "ok: markdown refused shared CI/cloud runner"
