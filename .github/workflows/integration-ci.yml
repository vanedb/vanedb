name: Cross-engine Integration CI

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  harness-lint:
    name: Lint the shared harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Check benchmark formatting
        run: cargo fmt --manifest-path bench/Cargo.toml --all -- --check
      - name: Check competitor-harness formatting
        run: cargo fmt --manifest-path bench/compare/Cargo.toml --all -- --check
      - name: Check fixed legacy graph files
        run: shasum -a 256 -c conformance/legacy_graph/SHA256SUMS
      - name: Check portable graph files
        run: shasum -a 256 -c conformance/graph/SHA256SUMS
      - name: Check competitor fixture checksums
        # Only verify files that exist (embeddings.vnef is hosted, not committed).
        working-directory: bench/compare/fixtures
        run: |
          set -euo pipefail
          verified=0
          while read -r digest name; do
            [[ -z "${digest:-}" || "$digest" =~ ^# ]] && continue
            name="${name#\*}"
            [[ -f "$name" ]] || continue
            echo "$digest  $name" | shasum -a 256 -c -
            verified=$((verified + 1))
          done < SHA256SUMS
          test "$verified" -ge 1
          # smoke.vnef must always be present and listed.
          grep -E '(^|[[:space:]\*])smoke\.vnef$' SHA256SUMS >/dev/null
          test -f smoke.vnef
          echo "ok: verified $verified present fixture checksum(s)"
      - name: Lint shared harness
        run: cargo clippy --manifest-path bench/Cargo.toml --all-targets --locked -- -D warnings
      - name: Lint competitor harness
        run: cargo clippy --manifest-path bench/compare/Cargo.toml --all-targets --locked -- -D warnings

  harness:
    name: Build and test both C ABIs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers the cmake/link glue; macos is the platform the README
        # snapshot is captured on.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Test shared harness
        run: cargo test --manifest-path bench/Cargo.toml --locked
      - name: Compile all cross-engine benchmarks
        run: cargo bench --manifest-path bench/Cargo.toml --locked --no-run
      # End-to-end proof that the report path still executes, at sizes that
      # finish in under a second. Shared-runner timings are meaningless, so
      # nothing here asserts one; recall is a correctness signal and the binary
      # asserts it against its own sanity floor.
      - name: Smoke-run the report binary
        env:
          VANEDB_BENCH_N: 500
          VANEDB_BENCH_DIM: 32
          VANEDB_BENCH_QUERIES: 5
          VANEDB_BENCH_OUT: ${{ runner.temp }}/RESULTS.md
        run: |
          cargo run --release --manifest-path bench/Cargo.toml --locked --bin report
          # Match the metric, not the type name: this check has drifted
          # from the report's wording three times across renames.
          grep -q 'recall@10' "$VANEDB_BENCH_OUT"
      - name: The harness must not write into the source tree
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "the harness left files in the working tree"
            exit 1
          fi

  compare-smoke:
    name: Competitor harness smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Test competitor harness
        run: cargo test --manifest-path bench/compare/Cargo.toml --locked
      - name: Smoke-run every engine on the smoke fixture
        # Correctness only: shared-runner timings are discarded by policy
        # (bench/COMPARISON.md). max-queries keeps the job short.
        # Default --ef sweep (16,32,50,100) so sqlite-vec / instant-distance
        # single-row collapse is non-vacuous vs HNSW peers.
        run: |
          cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke \
            --force-sqlite-vec-cosine \
            --rounds 1 \
            --max-queries 4 \
            --skip-save \
            --json-out "${{ runner.temp }}/compare-smoke.json"
          python3 bench/compare/scripts/assert_smoke_report.py \
            "${{ runner.temp }}/compare-smoke.json"
      - name: Smoke L2 includes native sqlite-vec
        run: |
          cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke \
            --metric l2 \
            --rounds 1 \
            --max-queries 2 \
            --ef 50 \
            --skip-save \
            --json-out "${{ runner.temp }}/compare-smoke-l2.json"
          python3 - <<'PY'
          import json
          r=json.load(open("${{ runner.temp }}/compare-smoke-l2.json"))
          assert r["metric"]=="l2", r["metric"]
          engines={row["engine"] for row in r["results"]}
          assert "sqlite-vec" in engines, engines
          assert len(engines)==6, engines
          print("ok: l2 smoke engines", sorted(engines))
          PY
      - name: Cosine default omits sqlite-vec
        run: |
          cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke \
            --rounds 1 \
            --max-queries 2 \
            --ef 50 \
            --skip-save \
            --skip-delete \
            --json-out "${{ runner.temp }}/compare-cosine-default.json"
          python3 - <<'PY'
          import json
          r=json.load(open("${{ runner.temp }}/compare-cosine-default.json"))
          engines={row["engine"] for row in r["results"]}
          assert "sqlite-vec" not in engines, engines
          assert len(engines)==5, engines
          print("ok: cosine default engines", sorted(engines))
          PY
      - name: Markdown smoke-role refuse (unit; GITHUB_ACTIONS is immutable on Actions)
        # Actions forbids overwriting GITHUB_*; clearing CI markers in step env
        # cannot reach the role gate on runners. Cover the message in unit tests.
        run: |
          cargo test --manifest-path bench/compare/Cargo.toml --locked \
            refuse_non_publish_role_smoke -- --nocapture
          echo "ok: smoke-role refuse covered by unit test"
      - name: Markdown cloud FS markers + dim + repo SUMS pin (unit)
        # Cursor cloud can `env -u CURSOR_AGENT`; FS markers must still refuse.
        # Beside-file SUMS / non-768 fixtures must not authorize --markdown.
        # libtest filters are literal substrings — never use `|` OR here.
        run: |
          cargo test --manifest-path bench/compare/Cargo.toml --locked \
            shared_runner_fs_markers_survive_cleared_env -- --nocapture
          cargo test --manifest-path bench/compare/Cargo.toml --locked \
            non_publish_dim_refused -- --nocapture
          cargo test --manifest-path bench/compare/Cargo.toml --locked \
            unpinned_repo_sha_refused -- --nocapture
          echo "ok: cloud FS / dim / repo-pin gates covered by unit tests"
      - name: Render refuses queries_measured shrink
        run: |
          python3 - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          report = {
              "report_kind": "vanedb-compare-v1",
              "fixture_role": "publish",
              "hardware_label": "linux-avx2",
              "host_os": "linux",
              "host_arch": "x86_64",
              "host_has_avx2": True,
              "host_android": False,
              "metric": "l2",
              "fixture_n_docs": 100_000,
              "fixture_n_queries": 1000,
              "queries_measured": 4,
              "fixture_dim": 768,
              "recorded_at_utc": "2026-01-01T00:00:00Z",
              "shared_runner": False,
              "dedicated_attested": True,
              "k": 10,
              "params": {"m": 16, "ef_construction": 200, "seed": 42},
              "fixture_sha256": "0" * 64,
              "results": [],
          }
          path = Path(tempfile.mkstemp(suffix=".json")[1])
          path.write_text(json.dumps(report))
          p = subprocess.run(
              ["python3", "bench/compare/scripts/render_comparison_md.py", str(path)],
              capture_output=True,
              text=True,
          )
          path.unlink(missing_ok=True)
          assert p.returncode != 0, p.stdout + p.stderr
          assert "queries_measured" in p.stderr, p.stderr
          print("ok: render refused queries_measured shrink")
          PY
      - name: fill_comparison_slot replaces Pending only
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "fill", "bench/compare/scripts/fill_comparison_slot.py"
          )
          fill = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(fill)
          sample = Path("bench/COMPARISON.md").read_text()
          body = "### linux-avx2 (host) — metric `l2`\n\n| Engine |\n|---|\n| vanedb |\n"
          out = fill.replace_slot(
              sample,
              "### Linux x86-64 AVX2 (dedicated box)",
              "#### Squared L2",
              body,
              False,
          )
          slot = out.split("### Linux x86-64 AVX2 (dedicated box)")[1].split("### Android")[0]
          l2 = slot.split("#### Squared L2")[1]
          assert "vanedb" in l2 and "*Pending.*" not in l2
          cos = slot.split("#### Cosine")[1].split("#### Squared L2")[0]
          assert cos.strip() == "*Pending.*"
          try:
              fill.replace_slot(
                  out,
                  "### Linux x86-64 AVX2 (dedicated box)",
                  "#### Squared L2",
                  body,
                  False,
              )
              raise SystemExit("expected refuse overwrite")
          except fill.SlotNotPending as e:
              assert "non-Pending" in str(e)
          # Dry-run path must not write.
          before = Path("bench/COMPARISON.md").read_text()
          assert before == sample
          print("ok: fill_comparison_slot Pending-only replace")
          PY
      - name: fill_comparison_slot e2e via render gates
        run: |
          python3 - <<'PY'
          import json, shutil, subprocess, tempfile
          from pathlib import Path

          sums = Path("bench/compare/fixtures/SHA256SUMS").read_text()
          sha = next(
              line.split()[0]
              for line in sums.splitlines()
              if line.strip().endswith("embeddings.vnef")
          )
          PUBLISH_EF = (16, 32, 50, 100)

          def eng(name, metric, *, efs=PUBLISH_EF):
              row = {
                  "engine": name,
                  "version": "0.0.0-test",
                  "metric": metric,
                  "rounds": 4,
                  "build_secs_median": 1.0,
                  "build_secs_spread": 0.01,
                  "peak_rss_bytes": 1024,
                  "file_size_bytes": 2048,
                  "delete_ok": True,
                  "latency_ns_by_ef": [
                      {"ef": ef, "median_ns": 1000.0, "spread": 0.01} for ef in efs
                  ],
                  "recall_at_k_by_ef": [
                      {"ef": ef, "recall_median": 0.9} for ef in efs
                  ],
                  "notes": [],
              }
              if name == "instant-distance":
                  row["latency_ns_by_ef"] = [{"ef": 50, "median_ns": 1000.0, "spread": 0.01}]
                  row["recall_at_k_by_ef"] = [{"ef": 50, "recall_median": 0.9}]
                  row["delete_ok"] = None
                  row["file_size_bytes"] = None
              if name == "hnsw_rs":
                  row["delete_ok"] = None
                  row["file_size_bytes"] = None
              if name == "sqlite-vec":
                  row["latency_ns_by_ef"] = [{"ef": 0, "median_ns": 1000.0, "spread": 0.01}]
                  row["recall_at_k_by_ef"] = [{"ef": 0, "recall_median": 0.9}]
              return row

          def report(metric):
              engines = ["vanedb", "usearch", "hnswlib", "instant-distance", "hnsw_rs"]
              if metric == "l2":
                  engines = engines + ["sqlite-vec"]
              return {
                  "report_kind": "vanedb-compare-v1",
                  "fixture_role": "publish",
                  "hardware_label": "linux-avx2",
                  "hostname": "ci-synthetic",
                  "commit": "deadbeef",
                  "host_os": "linux",
                  "host_arch": "x86_64",
                  "host_has_avx2": True,
                  "host_android": False,
                  "metric": metric,
                  "fixture_n_docs": 100_000,
                  "fixture_n_queries": 1000,
                  "queries_measured": 1000,
                  "fixture_dim": 768,
                  "fixture_sha256": sha,
                  "recorded_at_utc": "2026-01-01T00:00:00Z",
                  "shared_runner": False,
                  "dedicated_attested": True,
                  "k": 10,
                  "params": {"m": 16, "ef_construction": 200, "seed": 42},
                  "results": [eng(e, metric) for e in engines],
              }

          td = Path(tempfile.mkdtemp())
          try:
              cos = td / "linux-avx2-cosine.json"
              l2 = td / "linux-avx2-l2.json"
              cos.write_text(json.dumps(report("cosine")))
              l2.write_text(json.dumps(report("l2")))
              cmp = td / "COMPARISON.md"
              shutil.copy("bench/COMPARISON.md", cmp)
              before = cmp.read_text()
              assert before.count("*Pending.*") == 6
              # Cosine then L2 — must not abort on nested ### machine titles.
              p = subprocess.run(
                  [
                      "python3",
                      "bench/compare/scripts/fill_comparison_slot.py",
                      str(cos),
                      str(l2),
                      "--comparison",
                      str(cmp),
                  ],
                  capture_output=True,
                  text=True,
              )
              assert p.returncode == 0, p.stdout + p.stderr
              after = cmp.read_text()
              assert after.count("*Pending.*") == 4, after.count("*Pending.*")
              slot = after.split("### Linux x86-64 AVX2 (dedicated box)")[1].split(
                  "### Android"
              )[0]
              assert "*Pending.*" not in slot
              assert "metric `cosine`" in slot and "metric `l2`" in slot
              assert "sqlite-vec" in slot.split("#### Squared L2")[1]
              assert Path("bench/COMPARISON.md").read_text() == before
              print("ok: fill_comparison_slot e2e cosine+l2 via render gates")
          finally:
              shutil.rmtree(td, ignore_errors=True)
          PY
      - name: Markdown refuses force-sqlite-vec-cosine
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --force-sqlite-vec-cosine --markdown --rounds 2 --ef 50 \
            --json-out "${{ runner.temp }}/should-fail-force.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'force-sqlite-vec-cosine'
          echo "ok: markdown refused force-sqlite-vec-cosine (not masked by role)"
      - name: Markdown refuses skip-delete
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --skip-delete --markdown --rounds 2 --ef 50 \
            --json-out "${{ runner.temp }}/should-fail-skip-del.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'skip-delete'
          echo "ok: markdown refused skip-delete"
      - name: Markdown refuses skip-save
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --skip-save --markdown --rounds 2 --ef 50 \
            --json-out "${{ runner.temp }}/should-fail-skip-save.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'skip-save'
          echo "ok: markdown refused skip-save"
      - name: Markdown refuses non-canonical ef sweep
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 --ef 50 \
            --json-out "${{ runner.temp }}/should-fail-ef.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q '\-\-ef'
          echo "ok: markdown refused non-canonical --ef"
      - name: Markdown refuses engine cherry-pick
        run: |
          set +e
          out=$(cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 --engine vanedb \
            --json-out "${{ runner.temp }}/should-fail-engine.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'incomplete engine set'
          echo "ok: markdown refused engine cherry-pick"
      - name: Markdown refuses missing dedicated attestation
        run: |
          set +e
          out=$(env -u VANEDB_COMPARE_DEDICATED cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 \
            --json-out "${{ runner.temp }}/should-fail-dedicated.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'VANEDB_COMPARE_DEDICATED'
          echo "ok: markdown refused missing VANEDB_COMPARE_DEDICATED"
      - name: Markdown refuses shared CI runner even when attested
        run: |
          set +e
          out=$(VANEDB_COMPARE_DEDICATED=1 cargo run --release --manifest-path bench/compare/Cargo.toml --locked -- run \
            --fixture bench/compare/fixtures/smoke.vnef \
            --allow-smoke --markdown --rounds 2 \
            --json-out "${{ runner.temp }}/should-fail-ci.json" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -q 'shared CI/cloud'
          echo "ok: markdown refused shared CI/cloud runner"
      - name: maintainer_fill_host_comparison.sh refuses CI/cloud
        run: |
          set +e
          out=$(bash bench/compare/scripts/maintainer_fill_host_comparison.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          echo "$out" | grep -Eqi 'CI/cloud|hostedtoolcache|shared|Cursor|Codespaces'
          echo "ok: maintainer_fill refused CI/cloud shell"
      - name: refuse_shared_runner.sh — github-hosted / CI refuse; self-hosted allow
        run: |
          set -euo pipefail
          SCR=bench/compare/scripts/refuse_shared_runner.sh
          # Live github-hosted (or any CI with hostedtoolcache / CI=true): must refuse.
          set +e
          out=$(bash "$SCR" 2>&1)
          rc=$?
          set -e
          echo "$out"
          test "$rc" -ne 0
          # Self-hosted claim must not override hostedtoolcache when present.
          if [[ -e /opt/hostedtoolcache ]]; then
            set +e
            out2=$(env RUNNER_ENVIRONMENT=self-hosted bash "$SCR" 2>&1)
            rc2=$?
            set -e
            echo "$out2"
            test "$rc2" -ne 0
            echo "$out2" | grep -q hostedtoolcache
            echo "ok: self-hosted claim refused when hostedtoolcache present"
          elif [[ -e /opt/cursor || -e /exec-daemon ]]; then
            echo "ok: skip self-hosted-allow on Cursor FS markers"
          else
            # Clean host: CI vars + self-hosted must be allowed (Rust units cover FS order).
            env CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=self-hosted \
              bash "$SCR"
            echo "ok: self-hosted + CI vars allowed"
          fi
          echo "ok: refuse_shared_runner.sh CI coverage"
      - name: fill-comparison-self-hosted.yml lands via PR (not tip push)
        # main is ruleset-protected; tip `git push` cannot land AC3 results.
        run: |
          set -euo pipefail
          WF=.github/workflows/fill-comparison-self-hosted.yml
          grep -q 'pull-requests: write' "$WF"
          grep -q 'repos/.*/pulls' "$WF"
          # Bare tip push (historical bug) — allow only `git push -u origin HEAD:refs/heads/...`
          if grep -E '^\s*git push\s*$' "$WF"; then
            echo "::error::$WF must not tip-push; open a PR instead" >&2
            exit 1
          fi
          echo "ok: fill-comparison workflow opens a PR"
          # Publish JSON under runs/ is gitignored; the workflow must force-add it.
          if ! grep -qE 'git add -f .*runs/' "$WF"; then
            echo "::error::$WF must git add -f bench/compare/runs/*.json (gitignore)" >&2
            exit 1
          fi
          echo "ok: fill-comparison force-adds runs/*.json"
      - name: cut-demo-0.2.0.yml is dispatch-only with secret + concurrency
        run: |
          set -euo pipefail
          WF=.github/workflows/cut-demo-0.2.0.yml
          grep -q 'workflow_dispatch' "$WF"
          grep -q 'DEMO_REPO_TOKEN' "$WF"
          grep -q 'concurrency:' "$WF"
          grep -q 'cut-demo-0.2.0' "$WF"
          grep -q 'maintainer_cut_demo_0.2.0.sh --skip-tests' "$WF"
          grep -qi 'Historical' "$WF"
          if grep -qE '^\s*(push|pull_request):' "$WF"; then
            echo "::error::$WF must not run on tip push/PR" >&2
            exit 1
          fi
          echo "ok: cut-demo workflow is dispatch-only with concurrency (historical)"
      - name: tag-demo-0.2.0.yml is dispatch-only with vault confirm + secret
        run: |
          set -euo pipefail
          WF=.github/workflows/tag-demo-0.2.0.yml
          grep -q 'workflow_dispatch' "$WF"
          grep -q 'confirm_vault_walkthrough' "$WF"
          grep -q 'DEMO_REPO_TOKEN' "$WF"
          grep -q 'concurrency:' "$WF"
          grep -q 'tag-demo-0.2.0' "$WF"
          grep -q 'maintainer_tag_demo_0.2.0.sh' "$WF"
          grep -q -- '--confirm-vault-walkthrough' "$WF"
          grep -q -- '--merge-if-open' "$WF"
          if grep -qE '^\s*(push|pull_request):' "$WF"; then
            echo "::error::$WF must not run on tip push/PR" >&2
            exit 1
          fi
          echo "ok: tag-demo workflow is dispatch-only with vault confirm + merge-if-open"
      - name: Demo merge gate regression tests
        run: python3 scripts/test_demo_tag_gate.py
      - name: residual #242 tracking (no stale #226 evidence URLs / merge keywords)
        # #238's "does not close #N" phrase auto-completed #226; residual is #242.
        # AC5 candidate is demo PR #20 + vault + annotated tag (#271); historical
        # patch cut remains in-tree for local bare-remote tests but closeout
        # must refuse --cut for this candidate.
        run: |
          set -euo pipefail
          CUT=docs/launch/maintainer_cut_demo_0.2.0.sh
          CLOSE=docs/launch/maintainer_closeout_226.sh
          DEMO=docs/launch/0003-demo-update-checklist.md
          WF=.github/workflows/fill-comparison-self-hosted.yml
          grep -q 'issues/242' "$CUT"
          if grep -q 'issues/226' "$CUT"; then
            echo "::error::$CUT must not reply on auto-closed #226; use #242" >&2
            exit 1
          fi
          grep -q '#242 closeout status' "$CLOSE"
          grep -q 'Cursor App on vanedb/obsidian-vane-search' "$CLOSE"
          grep -q 'Cursor App scope:' "$CLOSE"
          grep -q '/installation/repositories' "$CLOSE"
          grep -q -- '--paginate' "$CLOSE"
          grep -q 'git/ref/tags/0.2.0' "$CLOSE"
          grep -q 'shared runner markers' "$CLOSE"
          grep -q 'obsidian-vane-search/pull/20' "$CLOSE"
          grep -q -- '--cut refused' "$CLOSE"
          grep -q 'maintainer_tag_demo_0.2.0.sh' "$CLOSE"
          grep -q '0.2.0-desktop-acceptance.md' "$CLOSE"
          grep -q 'maintainer merge, then --tag --confirm-vault-walkthrough' "$CLOSE" \
            || grep -q -- '--merge-if-open' "$CLOSE"
          grep -q 'vault recorded' "$CLOSE"
          grep -q '#242 How (paste into' "$CLOSE"
          SYNC=docs/launch/sync_242_how.sh
          SYNCWF=.github/workflows/sync-242-how.yml
          test -f "$SYNC"
          test -f "$SYNCWF"
          grep -q 'workflow_dispatch' "$SYNCWF"
          grep -q 'issues: write' "$SYNCWF"
          grep -q 'sync_242_how.sh --apply' "$SYNCWF"
          grep -q -- '--tag --confirm-vault-walkthrough' "$SYNC"
          if grep -E '^bash docs/launch/maintainer_closeout_226.sh --cut' "$SYNC"; then
            echo "::error::$SYNC must not recommend historical --cut" >&2
            exit 1
          fi
          body_out="$(bash "$SYNC")"
          echo "$body_out" | grep -q -- '--tag --confirm-vault-walkthrough'
          if echo "$body_out" | grep -E '^bash docs/launch/maintainer_closeout_226.sh --cut'; then
            echo "::error::$SYNC printed a --cut recommendation" >&2
            exit 1
          fi
          NUDGE=docs/launch/nudge_242_closeout.sh
          NUDGEWF=.github/workflows/nudge-242-closeout.yml
          test -f "$NUDGE"
          test -f "$NUDGEWF"
          grep -q 'workflow_dispatch' "$NUDGEWF"
          grep -q 'issues: write' "$NUDGEWF"
          grep -q 'nudge_242_closeout.sh --apply' "$NUDGEWF"
          grep -q 'gh issue reopen' "$NUDGE"
          grep -q 'reopens them while residuals remain' "$NUDGE"
          grep -q 'for issue in 242 198' "$NUDGE"
          grep -q 'Reopen #242/#198 if needed' "$NUDGEWF"
          grep -q 'cron:' "$NUDGEWF"
          nudge_out="$(bash "$NUDGE")"
          echo "$nudge_out" | grep -q -- '--tag --confirm-vault-walkthrough'
          echo "$nudge_out" | grep -q 'obsidian-vane-search/pull/20'
          echo "$nudge_out" | grep -q -- '--merge-if-open'
          echo "$nudge_out" | grep -q 'reopens them while residuals remain'
          if echo "$nudge_out" | grep -Eiq '(close|closes|fix|fixes)[[:space:]]+#(198|226|242)\b'; then
            echo "::error::$NUDGE must not use merge-closing keywords next to residual issues" >&2
            exit 1
          fi
          grep -q 'Cursor GitHub App' "$CUT"
          grep -q '/installation/repositories' "$CUT"
          grep -q -- '--paginate' "$CUT"
          grep -q 'gh auth token' "$CUT"
          grep -q 'vanedb#242' "$DEMO"
          # Tip still has historical cut docs until #271 merges; after that the
          # checklist names demo PR #20 / annotated tag. Accept either wording.
          if ! grep -qE 'obsidian-vane-search/pull/20|repositoryDependencies' "$DEMO"; then
            echo "::error::$DEMO must name demo PR #20 or (pre-#271) repositoryDependencies" >&2
            exit 1
          fi
          if grep -q 'git push --follow-tags' "$DEMO"; then
            echo "::error::$DEMO must not use lightweight tag + --follow-tags onto protected main" >&2
            exit 1
          fi
          if ! grep -qE 'annotated.*0\.2\.0|git tag -a 0\.2\.0' "$DEMO"; then
            echo "::error::$DEMO must require an annotated 0.2.0 tag" >&2
            exit 1
          fi
          if grep -Eiq '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)[[:space:]]+#(198|226|242)\b' "$WF" "$CUT" "$CLOSE" "$SYNC" "$SYNCWF" "$NUDGE" "$NUDGEWF"; then
            echo "::error::merge closing keywords next to residual issue numbers" >&2
            exit 1
          fi
          # closeout --cut must refuse (historical patch is not the candidate).
          if out=$(bash "$CLOSE" --cut 2>&1); then
            echo "::error::$CLOSE --cut must exit non-zero for current AC5 candidate" >&2
            echo "$out" >&2
            exit 1
          else
            echo "$out" | grep -q -- '--cut refused'
            echo "$out" | grep -q 'obsidian-vane-search/pull/20'
          fi
          # --all must still refuse --cut even when --fill fails (shared runner).
          set +e
          all_out=$(bash "$CLOSE" --all 2>&1)
          all_rc=$?
          set -e
          echo "$all_out"
          echo "$all_out" | grep -q -- '--cut refused'
          test "$all_rc" -eq 2
          echo "ok: --all refuses historical cut (exit $all_rc) after fill attempt"
          # Current AC5 helper: annotated tag on merged demo PR #20.
          TAGSCR=docs/launch/maintainer_tag_demo_0.2.0.sh
          test -f "$TAGSCR"
          grep -q 'git_no_ambient_url_rewrite' "$TAGSCR"
          grep -q 'GIT_CONFIG_GLOBAL=/dev/null' "$TAGSCR"
          grep -qF 'https://github.com/*' "$TAGSCR"
          grep -q 'confirm-vault-walkthrough' "$TAGSCR"
          grep -q -- '--merge-if-open' "$TAGSCR"
          grep -q 'gh_demo' "$TAGSCR"
          grep -q 'obsidian-vane-search/pull/20' "$TAGSCR"
          grep -q 'issues/242' "$TAGSCR"
          if grep -q 'issues/226' "$TAGSCR"; then
            echo "::error::$TAGSCR must not reply on auto-closed #226; use #242" >&2
            exit 1
          fi
          if out=$(bash "$TAGSCR" --dry-run 2>&1); then
            echo "::error::$TAGSCR must refuse without --confirm-vault-walkthrough" >&2
            echo "$out" >&2
            exit 1
          else
            echo "$out" | grep -qi 'confirm-vault-walkthrough'
          fi
          # Live PR #20 gate: Actions GITHUB_TOKEN is repo-scoped and often cannot
          # read vanedb/obsidian-vane-search. Probe when readable; otherwise assert
          # the refuse string is present (bare-remote step covers tag plumbing).
          grep -q 'must be MERGED before tagging' "$TAGSCR"
          if demo20_state="$(gh pr view 20 -R vanedb/obsidian-vane-search --json state -q .state 2>/dev/null)"; then
            if [[ "$demo20_state" != "MERGED" ]]; then
              # Without --merge-if-open, OPEN must still refuse.
              if out=$(bash "$TAGSCR" --dry-run --confirm-vault-walkthrough 2>&1); then
                echo "::error::$TAGSCR must refuse while demo PR #20 is $demo20_state (no --merge-if-open)" >&2
                echo "$out" >&2
                exit 1
              else
                echo "$out" | grep -qi 'MERGED'
              fi
              # With --merge-if-open --dry-run, OPEN + vault may proceed locally.
              if out=$(bash "$TAGSCR" --dry-run --confirm-vault-walkthrough --merge-if-open 2>&1); then
                echo "$out" | grep -qi 'would merge'
                echo "ok: --merge-if-open --dry-run accepts OPEN PR #20"
              else
                # Missing vault or unreadable head still refuses — acceptable.
                echo "$out" | grep -Eqi 'vault|MERGEABLE|MERGED|refused|HTTP|403|404|Could not'
                echo "ok: --merge-if-open --dry-run refused with diagnostic (vault/creds/API)"
              fi
            fi
          else
            echo "note: skipping live PR #20 gh probe (token cannot read demo repo)"
          fi
          echo "ok: residual tracking points at #242; closeout refuses historical --cut; tag helper gated"
      - name: maintainer_tag_demo_0.2.0.sh push to local bare remote
        # Proves the current AC5 tag path (no historical patch) against a local
        # bare remote. Uses demo PR #20 head (manifest already 0.2.0). Official
        # release still needs PR merge + vault confirm + push to GitHub.
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          BARE=$(mktemp -d)
          SRC=$(mktemp -d)
          git clone --depth 50 https://github.com/vanedb/obsidian-vane-search.git "$SRC/repo"
          git -C "$SRC/repo" fetch --depth 50 origin pull/20/head:pr20
          git -C "$SRC/repo" checkout pr20
          COMMIT="$(git -C "$SRC/repo" rev-parse HEAD)"
          ver="$(python3 -c 'import json; print(json.load(open("'"$SRC/repo"'/manifest.json"))["version"])')"
          test "$ver" = "0.2.0"
          git clone --bare "$SRC/repo" "$BARE/repo.git"
          # PR #20 may have diverged from demo main; local bare only needs main
          # at the candidate commit for the tag script under test.
          git -C "$SRC/repo" push --force "$BARE/repo.git" "HEAD:refs/heads/main"
          DEMO_URL="file://$BARE/repo.git" \
            bash docs/launch/maintainer_tag_demo_0.2.0.sh \
              --confirm-vault-walkthrough --commit="$COMMIT"
          git --git-dir="$BARE/repo.git" rev-parse "refs/tags/0.2.0"
          tagged="$(git --git-dir="$BARE/repo.git" rev-list -n 1 refs/tags/0.2.0)"
          test "$tagged" = "$COMMIT"
          echo "ok: demo tag script annotated 0.2.0 at PR #20 head on local bare remote"
      - name: maintainer_tag_demo_0.2.0.sh --dry-run ignores ambient GH_TOKEN
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ghp_not_a_real_token_scoped_away_from_demo
          GITHUB_TOKEN: ghp_not_a_real_token_scoped_away_from_demo
        run: |
          set -euo pipefail
          TAGSCR=docs/launch/maintainer_tag_demo_0.2.0.sh
          grep -q 'git_no_ambient_url_rewrite' "$TAGSCR"
          grep -q 'GIT_CONFIG_GLOBAL=/dev/null' "$TAGSCR"
          # Plant a Cursor-like insteadOf rewrite; dry-run must ignore it.
          git config --global \
            "url.https://x-access-token:ghp_ambient_should_not_appear@github.com/.insteadOf" \
            "https://github.com/"
          # With a fake GH_TOKEN, live PR probe fails closed (no MERGED string).
          # Assert refuse + insteadOf neutralization remain in-script; bare-remote
          # step covers end-to-end tag push without ambient rewrite.
          if out=$(bash "$TAGSCR" --dry-run --confirm-vault-walkthrough 2>&1); then
            echo "::error::$TAGSCR --dry-run --confirm must not succeed with fake GH_TOKEN" >&2
            echo "$out" >&2
            exit 1
          fi
          echo "$out" | grep -Eqi 'MERGED|HTTP|Bad credentials|Resource not accessible|Could not|denied|401|403|404'
          grep -qF 'https://github.com/*' "$TAGSCR"
          echo "ok: tag --dry-run refuses with fake token; ambient insteadOf neutralized in script"
      - name: maintainer_cut_demo_0.2.0.sh push to local bare remote
        # Proves the historical patch cut against a local bare remote (not the
        # current AC5 candidate — see maintainer_tag_demo_0.2.0.sh above).
        # Official release still needs a maintainer push to obsidian-vane-search.
        # Skip when demo tip already contains the patch (PR #20 / later main).
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          PATCH=docs/launch/0003-obsidian-vane-search-0.2.0.patch
          test -f "$PATCH"
          BARE=$(mktemp -d)
          SRC=$(mktemp -d)
          git clone --depth 50 https://github.com/vanedb/obsidian-vane-search.git "$SRC/repo"
          if ! git -C "$SRC/repo" apply --check "$PWD/$PATCH"; then
            echo "ok: skip historical cut bare-remote — patch no longer applies to demo tip (AC5 uses Tag)"
            exit 0
          fi
          git clone --bare "$SRC/repo" "$BARE/repo.git"
          git --git-dir="$SRC/repo/.git" --work-tree="$SRC/repo" \
            push "$BARE/repo.git" HEAD:refs/heads/main
          DEMO_URL="file://$BARE/repo.git" \
            bash docs/launch/maintainer_cut_demo_0.2.0.sh --skip-tests
          git --git-dir="$BARE/repo.git" rev-parse "refs/tags/0.2.0"
          ver=$(git --git-dir="$BARE/repo.git" show 0.2.0:manifest.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          test "$ver" = "0.2.0"
          echo "ok: demo cut script tagged 0.2.0 against local bare remote"
      - name: maintainer_cut_demo_0.2.0.sh --dry-run ignores ambient GH_TOKEN
        # Cursor cloud injects GH_TOKEN and global url.*.insteadOf rewrites
        # scoped to vanedb; those credentials 403 demo-repo writes. --dry-run
        # must still succeed with anonymous HTTPS (no ambient rewrite).
        # Skip when the historical patch no longer applies to demo tip.
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ghp_not_a_real_token_scoped_away_from_demo
          GITHUB_TOKEN: ghp_not_a_real_token_scoped_away_from_demo
        run: |
          set -euo pipefail
          CUT=docs/launch/maintainer_cut_demo_0.2.0.sh
          PATCH=docs/launch/0003-obsidian-vane-search-0.2.0.patch
          grep -q 'git_no_ambient_url_rewrite' "$CUT"
          grep -q 'GIT_CONFIG_GLOBAL=/dev/null' "$CUT"
          grep -qF 'https://github.com/*' "$CUT"
          CHECK=$(mktemp -d)
          git clone --depth 50 https://github.com/vanedb/obsidian-vane-search.git "$CHECK/repo"
          if ! git -C "$CHECK/repo" apply --check "$PWD/$PATCH"; then
            echo "ok: skip historical cut --dry-run — patch no longer applies to demo tip (AC5 uses Tag)"
            exit 0
          fi
          # Plant a Cursor-like insteadOf rewrite; the cut script must ignore it.
          git config --global \
            "url.https://x-access-token:ghp_ambient_should_not_appear@github.com/.insteadOf" \
            "https://github.com/"
          out=$(bash "$CUT" --skip-tests --dry-run)
          echo "$out" | grep -q -- '--dry-run: skipping push'
          echo "$out" | grep -q 'Local tag ready:'
          echo "ok: --dry-run ignores ambient GH_TOKEN + url.*.insteadOf"
