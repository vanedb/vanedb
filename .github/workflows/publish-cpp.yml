name: Publish vanedb-cpp

on:
  push:
    tags: ['vanedb-cpp-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected vanedb-cpp tag to PyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: cpp

jobs:
  validate-version:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Match product tag, package version, and publish request
        shell: bash
        env:
          REQUEST_PUBLISH: ${{ inputs.publish }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          prefix = "vanedb-cpp-v"
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          is_tag = os.environ["GITHUB_REF_TYPE"] == "tag"
          tag = os.environ["GITHUB_REF_NAME"]

          if is_tag:
              if not tag.startswith(prefix):
                  raise SystemExit(f"unexpected tag: {tag}")
              expected = tag.removeprefix(prefix)
              if version != expected:
                  raise SystemExit(f"tag expects {expected}, package version is {version}")

          publish_requested = os.environ.get("REQUEST_PUBLISH") == "true"
          if publish_requested and (
              os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
              or not is_tag
              or not tag.startswith(prefix)
          ):
              raise SystemExit(
                  "publishing requires a manual workflow run whose selected ref "
                  "is the matching vanedb-cpp product tag"
              )
          print(f"validated vanedb-cpp {version}")
          PY

      - name: Require release tag to be on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi

  build-wheels:
    name: Build wheels (${{ matrix.platform }})
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            architecture: x86_64
          - platform: macos-x86_64
            runner: macos-15-intel
            architecture: x86_64
          - platform: macos-arm64
            runner: macos-latest
            architecture: arm64
          - platform: windows-amd64
            runner: windows-latest
            architecture: AMD64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install --constraint "${{ github.workspace }}/.github/requirements-release.txt" cibuildwheel

      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-*
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {project}/tests/test_python_bindings.py -v
          # Each wheel is built and tested on its native architecture.
          CIBW_ARCHS: ${{ matrix.architecture }}

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanedb-cpp-wheels-${{ matrix.platform }}
          path: cpp/wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install --constraint "${{ github.workspace }}/.github/requirements-release.txt" build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanedb-cpp-sdist
          path: cpp/dist/*.tar.gz
          if-no-files-found: error

  sdist-test:
    name: Test source distribution
    needs: build-sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vanedb-cpp-sdist
          path: cpp/dist
      - name: Build, install, and test sdist
        shell: bash
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install pytest numpy
          python -m pip install --no-deps --force-reinstall dist/*.tar.gz
          python -m pip check
          python -m pytest tests/test_python_bindings.py -v

  validate-artifacts:
    name: Validate release artifacts
    needs: [build-wheels, sdist-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Validate artifact metadata and coverage
        shell: bash
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install --constraint "${{ github.workspace }}/.github/requirements-release.txt" packaging twine
          python -m twine check ../dist/*
          # Matrix contract: 4 native platforms x 6 CPython versions = 24
          # wheels. Keep these tripwires aligned with build-wheels above.
          python ../.github/scripts/validate_python_release.py \
            --directory ../dist \
            --distribution vanedb-cpp \
            --pyproject pyproject.toml \
            --wheel-count 16 \
            --sdist-count 1 \
            --python-tag cp311=4 \
            --python-tag cp312=4 \
            --python-tag cp313=4 \
            --python-tag cp314=4 \
            --platform-prefix manylinux=4 \
            --platform-prefix macosx=8 \
            --platform-prefix win=4

  publish:
    name: Publish vanedb-cpp to PyPI
    needs: validate-artifacts
    runs-on: ubuntu-latest
    # Product tag pushes build and retain artifacts. Publication stays manual
    # until the generic x86-64 CPU baseline is safe:
    # https://github.com/vanedb/vanedb-cpp/issues/39
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/vanedb-cpp-v')
    environment:
      name: pypi
      url: https://pypi.org/p/vanedb-cpp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
