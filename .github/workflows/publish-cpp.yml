name: Publish vanedb-cpp

on:
  push:
    tags: ['vanedb-cpp-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

defaults:
  run:
    working-directory: cpp

jobs:
  validate-version:
    name: Validate product tag
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Match tag and package version
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      run: |
        python - <<'PY'
        import os
        import tomllib
        from pathlib import Path

        prefix = "vanedb-cpp-v"
        tag = os.environ["GITHUB_REF_NAME"]
        expected = tag.removeprefix(prefix)
        actual = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
        if not tag.startswith(prefix) or actual != expected:
            raise SystemExit(f"tag {tag!r} does not match vanedb-cpp {actual}")
        print(f"validated vanedb-cpp {actual}")
        PY

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install cibuildwheel
      run: |
        python -m pip install --upgrade pip
        pip install cibuildwheel

    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
      env:
        # Build for Python 3.9 through 3.14
        CIBW_BUILD: cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*
        # Skip 32-bit builds and musllinux
        CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux*"
        # Test the wheels
        CIBW_TEST_REQUIRES: pytest numpy
        CIBW_TEST_COMMAND: pytest {project}/tests/test_python_bindings.py -v
        # macOS: Build separate Apple Silicon and Intel wheels
        CIBW_ARCHS_MACOS: x86_64 arm64
        # Linux: Build for x86_64
        CIBW_ARCHS_LINUX: x86_64
        # Windows: Build for AMD64
        CIBW_ARCHS_WINDOWS: AMD64

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: cpp/wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build sdist
      run: python -m build --sdist

    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: cpp/dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Product tags build and retain artifacts, but publication remains an
    # explicit action until the generic x86-64 CPU baseline is safe (#39).
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
