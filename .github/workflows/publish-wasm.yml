name: Publish vanedb-wasm to npm

# Its own tag, like the crate and the Python package, so the three artifacts
# can be verified and published independently.
on:
  push:
    tags: ['vanedb-wasm-v*']
  # Dispatch verifies only. The publish job tests `event_name == 'push'` rather
  # than `ref_type == 'tag'`, so a `--ref <a tag>` dispatch cannot reach it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and consume the package
    runs-on: ubuntu-latest
      # Without this a hung job holds GitHub's six-hour default. These are
      # the jobs that carry an OIDC credential and a protected environment,
      # so they are the ones where that matters most. The ceilings are far
      # above observed runtimes -- the slowest publish job measured 3m57s --
      # so they cannot bite a legitimate run. Time spent waiting for the
      # environment approval is not job runtime and is not counted.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Match tag and package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(python3 -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('vanedb-wasm/Cargo.toml').read_text())['package']['version'])")
          expected="vanedb-wasm-v${version}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "tag ${GITHUB_REF_NAME} expects $expected" >&2
            exit 1
          fi
          echo "validated vanedb-wasm ${version}"

      - name: Require release tag to be on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "release tags must point at a commit on main" >&2
            exit 1
          fi

      - name: Packaged README carries the published-install form
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vanedb-wasm-v')
        shell: bash
        run: python3 scripts/check_release_readmes.py "$GITHUB_REF_NAME"

      - name: Assemble the package
        run: python3 scripts/build_npm_package.py

      - name: Pack for inspection
        run: |
          npm pack target/npm/vanedb-wasm --pack-destination target/npm --ignore-scripts
          cd target/npm
          sha256sum ./*.tgz > SHA256SUMS

      - name: Consume the release tarball as an installed dependency
        run: python3 scripts/check_npm_package.py target/npm/*.tgz

      # The publish job is gated off in every rehearsal, so `npm publish` has
      # never executed until the run that cannot be undone. A dry run here
      # exercises the same command against the same tarball, without a
      # registry credential and without publishing.
      - name: Dry-run the publish command
        run: |
          cd target/npm
          tarball=$(awk '{ print $2 }' SHA256SUMS)
          npm publish "$tarball" --ignore-scripts --access public --dry-run

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanedb-wasm-npm
          path: |
            target/npm/*.tgz
            target/npm/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: verify
    # Same form as the crate and Python workflows: a workflow_dispatch can
    # never satisfy it, whatever ref it names.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vanedb-wasm-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      # Trusted publishing: npm exchanges this OIDC token for a short-lived
      # credential and records a provenance attestation tying the package to
      # this workflow and commit. No long-lived token is stored in the repo,
      # matching crates.io and PyPI.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vanedb-wasm-npm
          path: release

      - name: Verify the approved tarball
        id: approved
        run: |
          cd release
          # `sha256sum --check` verifies the files SHA256SUMS lists and says
          # nothing about files it does not. An extra tarball would therefore
          # pass, and `npm publish ./*.tgz` would glob it first and publish
          # bytes nothing verified. Require exactly one, and publish it by the
          # name the manifest gives rather than by a glob.
          count=$(find . -maxdepth 1 -name '*.tgz' | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one tarball in the artifact, found $count" >&2
            exit 1
          fi
          sha256sum --check SHA256SUMS
          tarball=$(awk '{ print $2 }' SHA256SUMS)
          test -f "$tarball"
          python3 ../scripts/check_npm_package.py "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # npm 11.5.1+ performs the OIDC exchange itself when the workflow has
      # `id-token: write` and a trusted publisher is configured for the
      # package. `--provenance` records the attestation.
      #
      # That configuration lives on the package's own settings page and cannot
      # be created before the package exists — npm has no equivalent of PyPI's
      # pending publisher. So the first version is published by hand with a
      # token and this job takes over from the second onwards, the same
      # bootstrap crates.io requires.
      - name: Update npm
        run: npm install -g npm@11.5.1

      # A prerelease must not take `latest`. `vanedb-wasm-v0.2.0-rc.1` passes
      # the version check above, and without an explicit dist-tag every
      # `npm install @vanedb/wasm` would resolve to it.
      - name: Choose the dist-tag
        id: disttag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#vanedb-wasm-v}"
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        run: npm publish "${{ steps.approved.outputs.tarball }}" --ignore-scripts --provenance --access public --tag "${{ steps.disttag.outputs.tag }}"
        working-directory: release
