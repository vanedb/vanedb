# Historical: apply 0003-obsidian-vane-search-0.2.0.patch and tag 0.2.0.
# NOT the current AC5 candidate — use workflow "Tag demo 0.2.0" (demo PR #20
# + vault confirmation) instead. Requires repository secret DEMO_REPO_TOKEN
# (contents:write on vanedb/obsidian-vane-search). Does not run on push/PR.
name: Cut demo 0.2.0

on:
  workflow_dispatch:

concurrency:
  group: cut-demo-0.2.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require DEMO_REPO_TOKEN
        env:
          DEMO_REPO_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: |
          if [ -z "${DEMO_REPO_TOKEN}" ]; then
            echo "::error::Add repository secret DEMO_REPO_TOKEN (contents:write on vanedb/obsidian-vane-search), then re-run."
            exit 1
          fi

      - name: Cut official 0.2.0 tag
        env:
          DEMO_REPO_TOKEN: ${{ secrets.DEMO_REPO_TOKEN }}
        run: bash docs/launch/maintainer_cut_demo_0.2.0.sh --skip-tests
