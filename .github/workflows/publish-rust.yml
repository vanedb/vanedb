name: Publish vanedb

on:
  push:
    tags: ['vanedb-v*']
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish validated vanedb artifacts to TestPyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Match product tag and package versions
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          prefix = "vanedb-v"
          pyproject = tomllib.loads(Path("vanedb-py/pyproject.toml").read_text())
          py_cargo = tomllib.loads(Path("vanedb-py/Cargo.toml").read_text())
          core_cargo = tomllib.loads(Path("vanedb/Cargo.toml").read_text())
          versions = {
              "vanedb-py/pyproject.toml": pyproject["project"]["version"],
              "vanedb-py/Cargo.toml": py_cargo["package"]["version"],
              "vanedb/Cargo.toml": core_cargo["package"]["version"],
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"package versions disagree: {versions}")

          version = next(iter(versions.values()))
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if not tag.startswith(prefix):
                  raise SystemExit(f"unexpected tag: {tag}")
              expected = tag.removeprefix(prefix)
              if version != expected:
                  raise SystemExit(f"tag expects {expected}, package version is {version}")
          print(f"validated vanedb {version}")
          PY
      - name: Require TestPyPI rehearsals to run from main
        if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "TestPyPI publication must be dispatched from main" >&2
            exit 1
          fi
      - name: Require release tag to be on main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "release tag must point to a commit on main" >&2
            exit 1
          fi

  linux:
    # "Edge" is mostly ARM Linux — Raspberry Pi, Jetson, Graviton, and Docker
    # on Apple Silicon, which defaults to linux/arm64. musl covers Alpine.
    # Each leg builds natively; no emulation.
    name: Linux wheels (${{ matrix.libc }} ${{ matrix.arch }}, Python 3.11–3.14)
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            libc: manylinux
            runner: ubuntu-latest
            manylinux: '2_17'
          - arch: aarch64
            libc: manylinux
            runner: ubuntu-24.04-arm
            manylinux: '2_17'
          - arch: x86_64
            libc: musllinux
            runner: ubuntu-latest
            manylinux: musllinux_1_2
          - arch: aarch64
            libc: musllinux
            runner: ubuntu-24.04-arm
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Build Linux wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.arch }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release --locked --compatibility pypi --out dist
            --manifest-path vanedb-py/Cargo.toml
            -i python3.11 -i python3.12 -i python3.13 -i python3.14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanedb-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  linux-test:
    name: Test Linux wheel (${{ matrix.arch }}, Python ${{ matrix.python-version }})
    needs: linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # arch is a real matrix axis so it crosses with python-version;
        # include only supplies the runner for each arch. Putting arch solely
        # in include would overwrite rather than cross-product.
        python-version: ['3.11', '3.12', '3.13', '3.14']
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vanedb-linux-manylinux-${{ matrix.arch }}
          path: dist
      - name: Install and test wheel
        shell: bash
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install pytest numpy
          python -m pip install --no-index --no-deps --find-links dist --force-reinstall vanedb
          python -m pip check
          python scripts/check_wheel_install.py vanedb
          python -m pytest vanedb-py/tests -v

  musl-test:
    # Alpine/musl is a shipped target, so it must be exercised before release.
    # The wheel is tested inside an Alpine container driven from the host:
    # running the job *in* a container instead would break the JS-based
    # actions, whose bundled Node is glibc-linked and cannot start on musl.
    name: Test musl wheel (${{ matrix.arch }}, Python ${{ matrix.python-version }})
    needs: linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vanedb-linux-musllinux-${{ matrix.arch }}
          path: dist
      - name: Confirm the artifact really is musl-tagged
        shell: bash
        run: |
          set -euo pipefail
          for wheel in dist/*.whl; do
            echo "$wheel"
            case "$wheel" in
              *musllinux*) ;;
              *)
                echo "non-musllinux wheel in the musl artifact: $wheel" >&2
                exit 1
                ;;
            esac
          done
      - name: Install and test the wheel under Alpine
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/work" --workdir /work \
            "python:${{ matrix.python-version }}-alpine" sh -euc '
            python3 -m venv /venv
            /venv/bin/python -m pip install --disable-pip-version-check --quiet \
              --no-index --no-deps --find-links dist vanedb
            /venv/bin/python -m pip install --disable-pip-version-check --quiet pytest numpy
            /venv/bin/python -m pip check
            /venv/bin/python scripts/check_wheel_install.py vanedb
            /venv/bin/python -m pytest vanedb-py/tests -v
          '

  macos:
    name: macOS wheels (${{ matrix.target }}, Python ${{ matrix.python-version }})
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - aarch64
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - target: x86_64
            runner: macos-15-intel
          - target: aarch64
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist --manifest-path vanedb-py/Cargo.toml -i python
      - name: Test wheel
        shell: bash
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install --no-index --no-deps --find-links dist --force-reinstall vanedb
          python -m pip install pytest numpy
          python -m pip check
          python scripts/check_wheel_install.py vanedb
          python -m pytest vanedb-py/tests -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanedb-macos-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  windows:
    name: Windows wheels (x64, Python ${{ matrix.python-version }})
    needs: validate-version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: x64
          args: --release --locked --compatibility pypi --out dist --manifest-path vanedb-py/Cargo.toml -i python
      - name: Test wheel
        shell: bash
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install --no-index --no-deps --find-links dist --force-reinstall vanedb
          python -m pip install pytest numpy
          python -m pip check
          python scripts/check_wheel_install.py vanedb
          python -m pytest vanedb-py/tests -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanedb-windows-x64-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist --manifest-path vanedb-py/Cargo.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vanedb-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  sdist-test:
    name: Test source distribution
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vanedb-sdist
          path: dist
      - name: Build, install, and test sdist
        shell: bash
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install pytest numpy
          python -m pip install --no-deps --force-reinstall dist/*.tar.gz
          python -m pip check
          python scripts/check_wheel_install.py vanedb
          python -m pytest vanedb-py/tests -v

  validate-artifacts:
    name: Validate release artifacts
    needs: [linux-test, musl-test, macos, windows, sdist-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Validate artifact metadata and coverage
        shell: bash
        run: |
          python -m pip install --upgrade --constraint "${{ github.workspace }}/.github/requirements-release.txt" pip
          python -m pip install --constraint "${{ github.workspace }}/.github/requirements-release.txt" packaging twine
          python -m twine check --strict dist/*
          # Matrix contract: Linux (2 libc x 2 arch x 4 Python) = 16,
          # macOS (2 arch x 4) = 8, Windows 4. Total 28, and each cpXXX tag
          # appears 7 times (4 Linux legs + 2 macOS + 1 Windows).
          # check_wheel_matrix.py derives these from the matrices above and
          # fails if they disagree.
          python .github/scripts/validate_python_release.py \
            --directory dist \
            --distribution vanedb \
            --pyproject vanedb-py/pyproject.toml \
            --wheel-count 28 \
            --sdist-count 1 \
            --python-tag cp311=7 \
            --python-tag cp312=7 \
            --python-tag cp313=7 \
            --python-tag cp314=7 \
            --platform-prefix manylinux=8 \
            --platform-prefix musllinux=8 \
            --platform-prefix macosx=8 \
            --platform-prefix win=4

  publish-testpypi:
    name: Publish vanedb to TestPyPI
    needs: validate-artifacts
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_testpypi &&
      github.ref == 'refs/heads/main'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vanedb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish vanedb to PyPI
    needs: validate-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vanedb-v')
    environment:
      name: pypi
      url: https://pypi.org/p/vanedb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
