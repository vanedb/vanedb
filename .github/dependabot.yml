version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One weekly PR instead of a burst. On 2026-11-14 five action bumps each
    # matched `.github/workflows/**` and ran the full 52-job CI (about 70
    # job-minutes and 24–40 min wall apiece) at the same time.
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # bincode 3.x intentionally fails compilation. The legacy 2.x wire format
    # remains a transition dependency until VNDB v1 replaces it.
    ignore:
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "cargo"
    directory: "/bench"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directory: "/bench/compare"
    schedule:
      interval: "weekly"
    # The competitor engines are pinned `=x.y.z` on purpose: COMPARISON.md
    # records the exact version each published row was measured against, so
    # bumping one silently makes the harness measure something the document
    # does not describe. Re-measuring against a newer competitor is a
    # deliberate act with its own PR and its own rows, not a dependency update.
    ignore:
      - dependency-name: "usearch"
      - dependency-name: "instant-distance"
      - dependency-name: "hnsw_rs"
      - dependency-name: "rusqlite"
  - package-ecosystem: "pip"
    directory: "/cpp"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
