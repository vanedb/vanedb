# Codecov configuration for the C++ engine.
# Codecov discovers this file from .github/ at the monorepo root.

coverage:
  precision: 2
  round: down
  range: 70..100

  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto

ignore:
  - "cpp/tests"
  - "cpp/benchmarks"
  - "cpp/examples"
  - "cpp/python"
  - "cpp/external"
  - "cpp/build"
  - ".*/_deps/.*"

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

flags:
  core:
    paths:
      - cpp/src/core/
    carryforward: true
