# Its own workspace root. Without this, bench resolves to the nearest
# ancestor manifest, so it builds only because the repo root excludes it —
# and fails outright in any checkout nested inside another Cargo workspace,
# such as a git worktree under the repo.
[workspace]

[package]
name = "vanedb-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
vanedb-capi = { path = "../vanedb-capi" }

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
# Only so the ground-truth kernels can be pinned to the engine they claim to
# reproduce; the harness itself talks to both engines through the C ABI.
vanedb = { path = "../vanedb" }
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "distance"
harness = false
[[bench]]
name = "store"
harness = false
[[bench]]
name = "index"
harness = false
[[bench]]
name = "disk"
harness = false

[[bin]]
name = "report"
path = "src/bin/report.rs"

[[bin]]
name = "abtest"
path = "src/bin/abtest.rs"
