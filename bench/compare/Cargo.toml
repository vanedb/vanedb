# Competitor benchmark arm (RFC 0003 / #198). Separate workspace so the
# C++-vs-Rust harness in ../ does not pull third-party ANN crates.
[workspace]

[package]
name = "vanedb-compare"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.85"
license = "MIT"
description = "Competitor benchmark harness for VaneDB (RFC 0003)"

[dependencies]
vanedb = { path = "../../vanedb", features = ["disk"] }
usearch = "=2.21.0"
instant-distance = "=0.6.1"
hnsw_rs = "=0.3.4"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
# Same major as rusqlite 0.32 so DEP_SQLITE3_INCLUDE reaches build.rs.
libsqlite3-sys = { version = "=0.30.1", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
libc = "0.2"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "compare"
path = "src/main.rs"
