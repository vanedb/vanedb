[package]
name = "vanedb-wasm"
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.85"
description = "Embeddable vector search for JavaScript and WebAssembly"
license = "MIT"
repository = "https://github.com/vanedb/vanedb"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
vanedb = { path = "../vanedb" }
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
