<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>VaneDB browser package acceptance</title>
<pre id="result">Running</pre>
<script type="module">
import init, { FlatIndex, ApproxIndex } from './package/vanedb_wasm.js';

const result = document.querySelector('#result');
function check(condition, message) {
    if (!condition) throw new Error(message);
}
function rejectsNumber(operation) {
    try { operation(); }
    catch (error) {
        check(/must be an integer between/.test(error.message), 'wrong numeric error');
        return;
    }
    throw new Error('invalid number was accepted');
}
const invalidNumbers = [-1, 1.5, NaN, Infinity, -Infinity, 2 ** 32, 2 ** 32 + 1];
const REQUIRE_PERSISTENCE = false;
async function main() {
    await init();
    if (REQUIRE_PERSISTENCE) {
        check(typeof ApproxIndex.load === 'function', 'merged package must expose ApproxIndex.load');
        check(typeof ApproxIndex.prototype.save === 'function', 'merged package must expose save');
    }
    if (typeof ApproxIndex.load === 'function') {
        const params = new URLSearchParams(location.search);
        if (!params.has('persisted')) {
            const index = new ApproxIndex(2, 'l2', 8, 4, 16, 7);
            index.add(101n, new Float32Array([1, 0]));
            await index.save('reload-survival');
            index.free();
            const next = new URL(location.href);
            next.searchParams.set('persisted', '1');
            location.replace(next.toString());
            // If the navigation does not happen, fail instead of hanging the
            // Playwright wait on "Running".
            await new Promise((_, reject) => {
                setTimeout(() => reject(new Error('reload navigation did not happen')), 2000);
            });
        }
        const loaded = await ApproxIndex.load('reload-survival');
        check(loaded !== null, 'IndexedDB load after reload returned null');
        try {
            check(loaded.size() === 1, 'IndexedDB load lost the vector');
            check([...loaded.get(101n)].join(',') === '1,0', 'IndexedDB load wrong vector');
        } finally { loaded.free(); }
        check(await ApproxIndex.load('no-such-index') === null, 'unknown name must resolve to null');
    }
    {
        const response = await fetch('./l2_rng1.vndb');
        check(response.ok, 'conformance fixture was not served');
        const fixture = new Uint8Array(await response.arrayBuffer());
        const fromRust = ApproxIndex.fromBytes(fixture);
        try {
            check(fromRust.size() === 3, 'Rust fixture loaded with the wrong size');
            check([...fromRust.get(101n)].join(',') === '1,0', 'Rust fixture vector mismatch');
            const hits = fromRust.search(new Float32Array([1, 0]), 1);
            try { check(hits.ids[0] === 101n, 'Rust fixture search disagreed'); }
            finally { hits.free(); }
            const saved = fromRust.toBytes();
            check(saved.length === fixture.length, 'browser save changed the fixture length');
            for (let i = 0; i < fixture.length; i += 1) {
                check(saved[i] === fixture[i], `browser save diverged at byte ${i}`);
            }
        } finally { fromRust.free(); }
    }
    for (const value of invalidNumbers) {
        rejectsNumber(() => new FlatIndex(value, 'l2'));
        for (const position of [0, 2, 3, 4]) {
            const args = [3, 'l2', 2, 4, 16];
            args[position] = value;
            rejectsNumber(() => new ApproxIndex(...args));
        }
    }
    for (const metric of ['l2', 'cosine', 'dot']) {
        for (const create of [
            () => new FlatIndex(3, metric),
            () => new ApproxIndex(3, metric, 2, 4, 16),
        ]) {
            const index = create();
            try {
                const id = 2n ** 64n - 1n;
                index.add_batch(new BigUint64Array([id, 1n]),
                    new Float32Array([1, 0, 0, 0, 1, 0]));
                for (const value of invalidNumbers) {
                    rejectsNumber(() => index.search(new Float32Array([1, 0, 0]), value));
                    if (index instanceof ApproxIndex) {
                        index.ef_search = 16;
                        rejectsNumber(() => { index.ef_search = value; });
                        rejectsNumber(() => index.search(new Float32Array([1, 0, 0]), 2, value));
                        check(index.ef_search === 16, 'invalid setting changed ef_search');
                    }
                }
                const hits = index.search(new Float32Array([1, 0, 0]), 2);
                try {
                    check(hits.ids.length === 2 && hits.ids[0] === id, 'wrong nearest ID');
                    check(hits.distances[0] === (metric === 'dot' ? -1 : 0), 'wrong distance');
                } finally { hits.free(); }
                let rejected = false;
                try { index.add(-1n, new Float32Array([1, 0, 0])); }
                catch { rejected = true; }
                check(rejected && index.size() === 2, 'invalid ID was accepted');
                if (index instanceof ApproxIndex) {
                    index.upsert(id, new Float32Array([0, 0, 1]));
                    check(index.size() === 2 && index.tombstones() === 1, 'upsert did not replace');
                    index.upsert(2n, new Float32Array([1, 0, 0]));
                    check(index.size() === 3, 'upsert did not insert');
                    for (const vector of [new Float32Array([1, 2]), new Float32Array([NaN, 0, 0])]) {
                        let failed = false;
                        try { index.upsert(id, vector); }
                        catch { failed = true; }
                        check(failed && index.size() === 3 && index.tombstones() === 1,
                            'rejected upsert changed the index');
                        check([...index.get(id)].join(',') === '0,0,1', 'rejected upsert lost the vector');
                    }
                    index.ef_search = 1;
                    for (const ef of [undefined, null, 0, 64, 2 ** 32 - 1]) {
                        const widened = index.search(new Float32Array([1, 0, 0]), 3, ef);
                        try {
                            check(widened.ids.length === 3 && widened.ids[0] === 2n,
                                'per-query search returned the wrong results');
                        } finally { widened.free(); }
                        check(index.ef_search === 1, 'per-query search changed the default');
                    }
                    index.compact();
                    check(index.tombstones() === 0 && index.size() === 3, 'compact lost upserted entries');
                    const bytes = index.toBytes();
                    check(bytes instanceof Uint8Array && bytes.length > 4, 'toBytes did not return a file');
                    check(String.fromCharCode(...bytes.slice(0, 4)) === 'VNDB', 'toBytes is not a VNDB file');
                    const reloaded = ApproxIndex.fromBytes(bytes);
                    try {
                        check(reloaded.size() === 3, 'fromBytes lost entries');
                        const again = reloaded.search(new Float32Array([1, 0, 0]), 1);
                        try { check(again.ids[0] === 2n, 'fromBytes search disagreed'); }
                        finally { again.free(); }
                    } finally { reloaded.free(); }
                    index.remove(2n);
                }
                index.remove(id);
                check(!index.contains(id) && index.size() === 1, 'remove failed');
            } finally { index.free(); }
        }
    }
    result.textContent = 'PASS: packaged browser bindings, both indexes, all metrics';
}
main().catch((error) => {
    result.textContent = `FAIL: ${error.stack || error}`;
    throw error;
});
</script>
