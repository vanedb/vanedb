[package]
name = "vanedb-py"
version = "0.1.0-rc.1"
edition = "2021"
# Bound by bincode 2.x, the newest runtime dependency. CI checks it.
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "vanedb"
crate-type = ["cdylib"]

[dependencies]
parking_lot = "0.12"
pyo3 = { version = "0.29", features = ["extension-module"] }
vanedb = { path = "../vanedb", features = ["disk"] }
