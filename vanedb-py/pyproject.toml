[build-system]
# 1.9.3 includes the PEP 639 wheel metadata and source-license fixes.
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "vanedb"
version = "0.1.0-rc.1"
description = "Embeddable vector database for edge AI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# MIT requires the notice to travel with copies, so the text has to be in
# the wheel itself; a link in the description does not satisfy it.
license-files = ["LICENSE"]
keywords = ["vector", "database", "embedding", "embeddings", "hnsw",
            "similarity-search", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]

[tool.maturin]
features = ["pyo3/extension-module"]
# Ships py.typed and __init__.pyi alongside the compiled module; a generated
# __init__ cannot carry them.
python-source = "python"
module-name = "vanedb.vanedb"
