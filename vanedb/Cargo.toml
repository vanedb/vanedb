[package]
name = "vanedb"
version = "1.0.0"
edition = "2021"
# Bound by bincode 2.x, the newest runtime dependency. CI checks it.
rust-version = "1.85"
description = "Embeddable vector database for edge AI"
readme = "README.md"
license = "MIT"
repository = "https://github.com/vanedb/vanedb"
keywords = ["vector", "database", "embeddings", "hnsw", "similarity-search"]
categories = ["database", "science"]

# DiskIndex is behind a non-default feature, so the published docs would omit
# it unless docs.rs is told to build with it.
[package.metadata.docs.rs]
features = ["disk"]
# Renders the "requires feature" badge, so the docs do not offer a type that
# a default `cargo add vanedb` does not provide.
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
disk = ["dep:memmap2"]
gpu-metal = ["dep:metal", "dep:objc"]
gpu-cuda = ["dep:cudarc"]

[dependencies]
parking_lot = "0.12"
memmap2 = { version = "0.9", optional = true }
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }
cudarc = { version = "0.19", optional = true }
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }

[dev-dependencies]
proptest = "1.6"
criterion = { version = "0.8", features = ["html_reports"] }

[lib]
# Skip the libtest harness under `cargo bench`; it doesn't accept criterion
# CLI flags like --save-baseline that the [[bench]] targets need.
bench = false

[[bench]]
name = "distance_bench"
harness = false

[[bench]]
name = "flat_bench"
harness = false

[[bench]]
name = "approx_bench"
harness = false
