[package]
name = "vanedb-capi"
version = "0.1.0-rc.2"
edition = "2021"
# Bound by bincode 2.x, the newest runtime dependency. CI checks it.
rust-version = "1.85"
license = "MIT"
# The C ABI ships as a built artifact, not a crates.io package.
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
vanedb = { path = "../vanedb", features = ["disk"] }

[build-dependencies]
cbindgen = "0.29"
